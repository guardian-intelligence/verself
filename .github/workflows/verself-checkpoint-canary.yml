name: Verself Checkpoint Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

concurrency:
  group: verself-checkpoint-canary
  cancel-in-progress: false

jobs:
  checkpoint-canary:
    name: Source + GitHub checkpoint canary
    runs-on: [self-hosted, linux, x64, verself-4vcpu-ubuntu-2404]
    timeout-minutes: 180
    env:
      VERSELF_TOKEN: ${{ secrets.VERSELF_PLATFORM_CANARY_TOKEN }}
      CHECKPOINT_CANARY_GITHUB_TOKEN: ${{ secrets.CHECKPOINT_CANARY_GITHUB_TOKEN }}
      CHECKPOINT_CANARY_GITHUB_OWNER: ${{ vars.CHECKPOINT_CANARY_GITHUB_OWNER }}
      CHECKPOINT_CANARY_PROVIDERS: source,github
      CHECKPOINT_CANARY_WORKLOADS: express-npm,python-click,db-seed
      CHECKPOINT_CANARY_RUNNER_LABEL: verself-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Bootstrap toolchain
        env:
          BOOTSTRAP_INSTALL_DIR: ${{ runner.temp }}/bootstrap-bin
        run: |
          mkdir -p "${BOOTSTRAP_INSTALL_DIR}"
          scripts/bootstrap-linux-amd64
          {
            echo "${BOOTSTRAP_INSTALL_DIR}"
            echo "${HOME}/.vite-plus/bin"
          } >> "${GITHUB_PATH}"

      - name: Run checkpoint canary
        run: bazelisk run //src/tools/operator/cmd/aspect-operator -- checkpoint-canary --output=json

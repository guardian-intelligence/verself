name: Gamma Deploy

# Steady-state deploys: mint a GitHub Actions OIDC identity and submit the
# dispatched ref's SHA to gamma's deployment-service, which builds, signs
# deployment evidence via OpenBao Transit, and gates rollout on distribution
# admission. Runs on a GitHub-hosted runner so the deploy trigger does not
# depend on the fleet it is deploying.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gamma-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Submit deployment to gamma
    if: github.repository == 'guardian-intelligence/verself' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/ansible-nomad-deletion-pass')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Stock checkout: the Verself checkout action requires the host mirror
      # env that only exists inside Verself runner VMs, not on ubuntu-latest.
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap toolchain
        run: src/tools/dev/bootstrap/bootstrap-linux-amd64

      - name: Deploy
        run: aspect deploy --site=gamma --sha="$GITHUB_SHA"

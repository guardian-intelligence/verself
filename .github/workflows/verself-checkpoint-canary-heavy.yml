name: Verself Checkpoint Canary (heavy)

on:
  workflow_dispatch:
  schedule:
    # Heavy real-world OSS workloads (rules_go, next.js) once a day. These
    # exercise the same restore/save path as the light canary but with
    # larger working sets so the wall-clock breakdown picks up the
    # zfs-clone and zfs-send overhead at scale.
    - cron: '47 4 * * *'

permissions:
  contents: read

concurrency:
  group: verself-checkpoint-canary-heavy
  cancel-in-progress: false

jobs:
  checkpoint-canary-heavy:
    name: Heavy real-world OSS canary
    runs-on: [self-hosted, linux, x64, verself-4vcpu-ubuntu-2404]
    timeout-minutes: 240
    env:
      VERSELF_TOKEN: ${{ secrets.VERSELF_PLATFORM_CANARY_TOKEN }}
      CHECKPOINT_CANARY_GITHUB_TOKEN: ${{ secrets.CHECKPOINT_CANARY_GITHUB_TOKEN }}
      CHECKPOINT_CANARY_GITHUB_OWNER: ${{ vars.CHECKPOINT_CANARY_GITHUB_OWNER }}
      CHECKPOINT_CANARY_PROVIDERS: source,github
      CHECKPOINT_CANARY_WORKLOADS: rules-go-bazel,next-pnpm
      CHECKPOINT_CANARY_RUNNER_LABEL: verself-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Bootstrap toolchain
        env:
          BOOTSTRAP_INSTALL_DIR: ${{ runner.temp }}/bootstrap-bin
        run: |
          mkdir -p "${BOOTSTRAP_INSTALL_DIR}"
          scripts/bootstrap-linux-amd64
          {
            echo "${BOOTSTRAP_INSTALL_DIR}"
            echo "${HOME}/.vite-plus/bin"
          } >> "${GITHUB_PATH}"

      - name: Run checkpoint canary
        run: |
          mkdir -p "${RUNNER_TEMP}/canary"
          bazelisk run //src/tools/operator/cmd/aspect-operator -- checkpoint-canary --output=json \
            > "${RUNNER_TEMP}/canary/report.json"

      - name: Upload checkpoint canary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verself-checkpoint-canary-heavy-report
          path: ${{ runner.temp }}/canary/report.json
          retention-days: 30

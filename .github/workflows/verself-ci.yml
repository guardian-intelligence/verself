name: Verself CI

on:
  push:
    branches:
      - main
      - beta
      - gamma
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verself-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test (Verself runner, durable workspace)
    runs-on: [self-hosted, linux, x64, verself-4vcpu-ubuntu-2404]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: guardian-intelligence/verself/.github/actions/checkout@main
        with:
          persist-credentials: false

      - name: Verify durable workspace tracer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          if [ -f .verself-tracer/build-state ]; then
            echo "verself durable workspace tracer: hit"
            cat .verself-tracer/build-state
          else
            echo "verself durable workspace tracer: miss"
          fi
          mkdir -p .verself-tracer
          printf '%s run=%s attempt=%s sha=%s\n' "$(date -u +%FT%TZ)" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_SHA}" >> .verself-tracer/build-state

      - name: Verify durable Bazel cache mounts
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERSELF_CACHE_BAZEL:-}"
          test -d "${VERSELF_CACHE_BAZEL}"
          for cache_path in "${HOME}/.cache/bazel-disk" "${HOME}/.cache/bazel-repo"; do
            test -d "${cache_path}"
            mountpoint -q "${cache_path}"
          done
          marker="${HOME}/.cache/bazel-disk/.verself-cache-tracer"
          if [ -f "${marker}" ]; then
            echo "verself durable bazel cache tracer: hit"
            tail -n 1 "${marker}"
          else
            echo "verself durable bazel cache tracer: miss"
          fi
          printf '%s run=%s attempt=%s sha=%s\n' "$(date -u +%FT%TZ)" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_SHA}" >> "${marker}"

      - name: Verify durable pnpm cache mounts
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERSELF_CACHE_PNPM:-}"
          test -d "${VERSELF_CACHE_PNPM}"
          store_path="${HOME}/.local/share/pnpm/store"
          test -d "${store_path}"
          mountpoint -q "${store_path}"
          marker="${VERSELF_CACHE_PNPM}/.verself-cache-tracer"
          if [ -f "${marker}" ]; then
            echo "verself durable pnpm cache tracer: hit"
            tail -n 1 "${marker}"
          else
            echo "verself durable pnpm cache tracer: miss"
          fi
          printf '%s run=%s attempt=%s sha=%s\n' "$(date -u +%FT%TZ)" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_SHA}" >> "${marker}"

      - name: Bootstrap toolchain
        env:
          BOOTSTRAP_INSTALL_DIR: ${{ runner.temp }}/bootstrap-bin
        run: |
          mkdir -p "${BOOTSTRAP_INSTALL_DIR}"
          scripts/bootstrap-linux-amd64
          {
            echo "${BOOTSTRAP_INSTALL_DIR}"
            echo "${HOME}/.vite-plus/bin"
          } >> "${GITHUB_PATH}"

      - name: Build Bazel telemetry wrapper
        run: bazelisk --batch build //src/tools/observability/go/cmd/verself-bazel:verself-bazel

      - name: bazel build //...
        run: bazel-bin/src/tools/observability/go/cmd/verself-bazel/verself-bazel_/verself-bazel --upload=required build //...

      - name: bazel test //...
        run: bazel-bin/src/tools/observability/go/cmd/verself-bazel/verself-bazel_/verself-bazel --upload=required test //...

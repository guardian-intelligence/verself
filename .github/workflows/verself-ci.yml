name: Verself CI

on:
  push:
    branches:
      - main
      - beta
      - gamma
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + test (Verself runner, native Checkpoints)
    runs-on: [self-hosted, linux, x64, verself-4vcpu-ubuntu-2404]
    timeout-minutes: 30
    env:
      VERSELF_NPM_REGISTRY_TOKEN: ${{ secrets.VERSELF_NPM_REGISTRY_TOKEN_GITHUB_ACTIONS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Mount Bazel disk cache
        uses: useverself/checkpoint@v0
        with:
          key: ${{ github.repository }}-bazel-disk-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc') }}
          path: /home/runner/.cache/bazel-disk
          size-gb: '50'

      - name: Mount Bazel repository cache
        uses: useverself/checkpoint@v0
        with:
          key: ${{ github.repository }}-bazel-repo-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          path: /home/runner/.cache/bazel-repo
          size-gb: '10'

      - name: Mount pnpm store
        uses: useverself/checkpoint@v0
        with:
          key: ${{ github.repository }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          path: /home/runner/.local/share/pnpm/store
          size-gb: '8'

      - name: Bootstrap toolchain
        env:
          BOOTSTRAP_INSTALL_DIR: ${{ runner.temp }}/bootstrap-bin
        run: |
          mkdir -p "${BOOTSTRAP_INSTALL_DIR}"
          scripts/bootstrap-linux-amd64
          {
            echo "${BOOTSTRAP_INSTALL_DIR}"
            echo "${HOME}/.vite-plus/bin"
          } >> "${GITHUB_PATH}"

      - name: Restart Bazel server
        run: bazelisk shutdown

      - name: bazelisk build //...
        run: bazelisk build --action_env=VERSELF_NPM_REGISTRY_TOKEN //...

      - name: bazelisk test //...
        run: bazelisk test --action_env=VERSELF_NPM_REGISTRY_TOKEN //...

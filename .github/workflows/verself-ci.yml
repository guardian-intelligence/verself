name: Verself CI

on:
  push:
    branches:
      - main
      - beta
      - gamma
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verself-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build with warm VM (Verself runner, durable workspace)
    runs-on: verself-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: guardian-intelligence/verself/.github/actions/checkout@main
        with:
          persist-credentials: false

      - name: Bootstrap toolchain
        run: src/tools/dev/bootstrap/bootstrap-linux-amd64

      - name: Build and Test
        run: |
          set -euo pipefail
          if [ -n "${RUNNER_TRACKING_ID:-}" ]; then
            echo "GitHub runner process cleanup marker is present in the step environment."
            unset RUNNER_TRACKING_ID
          fi
          started_ms="$(($(date +%s%N) / 1000000))"
          bazelisk test //...
          finished_ms="$(($(date +%s%N) / 1000000))"
          echo "::notice title=Verself workload timing::workload=full-repo duration_ms=$((finished_ms - started_ms))"
          server_pid="$(bazelisk info server_pid)"
          if [ -z "$server_pid" ] || [ ! -r "/proc/${server_pid}/environ" ]; then
            echo "::error::Bazel server process ${server_pid:-<empty>} is not inspectable"
            exit 1
          fi
          if tr '\0' '\n' < "/proc/${server_pid}/environ" | grep -q '^RUNNER_TRACKING_ID='; then
            echo "::error::Bazel server inherited RUNNER_TRACKING_ID and will be killed by GitHub runner cleanup"
            exit 1
          fi
          echo "Bazel server ${server_pid} does not carry RUNNER_TRACKING_ID."

  deploy-prod:
    name: Deploy prod
    needs: build
    if: ${{ github.repository == 'guardian-intelligence/verself' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: verself-4vcpu-ubuntu-2404
    timeout-minutes: 60
    environment:
      name: prod
      url: https://verself.sh
    concurrency:
      group: verself-deploy-prod
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: guardian-intelligence/verself/.github/actions/checkout@main
        with:
          persist-credentials: false

      - name: Bootstrap toolchain
        run: src/tools/dev/bootstrap/bootstrap-linux-amd64

      - name: Detect deploy SSH key
        id: deploy_ssh_key
        env:
          VERSELF_PROD_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.VERSELF_PROD_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VERSELF_PROD_DEPLOY_SSH_PRIVATE_KEY:-}" ]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=Prod deploy skipped::VERSELF_PROD_DEPLOY_SSH_PRIVATE_KEY is not configured"
          else
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Start deploy SSH agent
        if: ${{ steps.deploy_ssh_key.outputs.available == 'true' }}
        env:
          VERSELF_PROD_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.VERSELF_PROD_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          printf '%s\n' "${VERSELF_PROD_DEPLOY_SSH_PRIVATE_KEY}" | ssh-add - >/dev/null
          {
            echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}"
            echo "SSH_AGENT_PID=${SSH_AGENT_PID}"
          } >> "${GITHUB_ENV}"

      - name: Deploy prod
        if: ${{ steps.deploy_ssh_key.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          if [ -n "${RUNNER_TRACKING_ID:-}" ]; then
            echo "GitHub runner process cleanup marker is present in the step environment."
            unset RUNNER_TRACKING_ID
          fi
          started_ms="$(($(date +%s%N) / 1000000))"
          aspect deploy --site=prod --sha="${GITHUB_SHA}"
          finished_ms="$(($(date +%s%N) / 1000000))"
          echo "::notice title=Verself deploy timing::site=prod sha=${GITHUB_SHA} duration_ms=$((finished_ms - started_ms))"

      - name: Stop deploy SSH agent
        if: ${{ always() && steps.deploy_ssh_key.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k >/dev/null
          fi

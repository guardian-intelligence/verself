name: Verself CI

on:
  push:
    branches:
      - main
      - beta
      - gamma
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verself-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Verself runner, durable workspace)
    runs-on: [self-hosted, linux, x64, verself-4vcpu-ubuntu-2404]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: guardian-intelligence/verself/.github/actions/checkout@main
        with:
          persist-credentials: false

      - name: Bootstrap toolchain
        run: |
          export BOOTSTRAP_INSTALL_DIR="${HOME}/.cache/verself/bootstrap-bin"
          mkdir -p "${BOOTSTRAP_INSTALL_DIR}"
          src/tools/dev/bootstrap/bootstrap-linux-amd64
          {
            echo "${BOOTSTRAP_INSTALL_DIR}"
            echo "${HOME}/.vite-plus/bin"
          } >> "${GITHUB_PATH}"

      - name: bazel build //...
        run: bazelisk --batch build //...

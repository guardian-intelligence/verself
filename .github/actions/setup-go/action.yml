name: Verself Setup Go
description: |
  Wraps actions/setup-go and mounts Verself Checkpoints for the Go module
  cache and the build cache so workflows previously using
  useblacksmith/setup-go@v6 keep the same drop-in shape. Restored bytes
  are tool-reconciled by `go build` and `go mod download`.

inputs:
  go-version:
    description: Go version (passed to actions/setup-go).
    required: false
  go-version-file:
    description: Path to a file containing the Go version.
    required: false
  cache-dependency-path:
    description: Path to go.sum used in the Checkpoint cache key.
    required: false
    default: go.sum

outputs:
  go-version:
    description: The installed Go version.
    value: ${{ steps.setup.outputs.go-version }}
  module-cache-hit:
    description: true when the module cache Checkpoint restored a generation.
    value: ${{ steps.mod-cache.outputs.cache-hit }}
  build-cache-hit:
    description: true when the build cache Checkpoint restored a generation.
    value: ${{ steps.build-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: mod-cache
      uses: ./.github/actions/checkpoint
      with:
        key: verself-setup-go-mod-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}
        path: ~/go/pkg/mod
    - id: build-cache
      uses: ./.github/actions/checkpoint
      with:
        key: verself-setup-go-build-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}
        path: ~/.cache/go-build
    - id: setup
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version-file }}
        cache: 'false'

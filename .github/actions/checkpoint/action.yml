name: Verself Checkpoint
description: Mount a Verself Checkpoints zvol for a workflow cache path.
inputs:
  key:
    description: Checkpoint key.
    required: true
  path:
    description: Absolute path or path relative to GITHUB_WORKSPACE.
    required: true
  size-gb:
    description: |
      Size in GiB for the empty zvol used when no committed generation
      exists yet (cold start). Defaults to 5. Bazel disk caches and
      Docker BuildKit caches typically want 30-50; npm and pip caches
      are fine at 5. Cache-restore paths from a committed generation
      ignore this and inherit the source generation's size.
    required: false
    default: '5'
outputs:
  cache-hit:
    description: true when the checkpoint restored an existing generation.
  mount-id:
    description: Verself checkpoint mount identifier.
  generation:
    description: Source generation restored into the checkpoint mount.
runs:
  using: node24
  main: dist/index.js
  post: dist/index.js

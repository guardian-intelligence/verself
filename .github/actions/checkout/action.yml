name: Verself Checkout
description: Materialize the current GitHub workflow SHA from the Verself host mirror without deleting durable build state.
inputs:
  repository:
    description: Repository to checkout, formatted as owner/name.
    required: false
    default: ${{ github.repository }}
  ref:
    description: Full Git ref to fetch, for example refs/heads/main or refs/pull/1/merge.
    required: false
    default: ${{ github.ref }}
  path:
    description: Checkout path relative to GITHUB_WORKSPACE.
    required: false
    default: "."
  clean:
    description: Reset tracked files before checkout. Verself does not run git clean -ffdx by default because the workspace is durable.
    required: false
    default: "false"
  fetch-depth:
    description: Accepted for actions/checkout familiarity. Verself checkout currently materializes one commit.
    required: false
    default: "1"
  persist-credentials:
    description: Accepted for actions/checkout familiarity. Verself checkout does not persist GitHub credentials.
    required: false
    default: "false"
  token:
    description: GitHub token used only when the host cache has to fetch the requested commit.
    required: false
    default: ${{ github.token }}
outputs:
  preexisting-head:
    description: Commit that was present in the workspace before checkout, when available.
  commit:
    description: Commit SHA that was checked out.
runs:
  using: node24
  main: dist/index.js

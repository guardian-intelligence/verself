name: Verself Setup Node
description: |
  Wraps actions/setup-node and mounts a Verself Checkpoint for the npm
  package cache so customer workflows that previously used
  useblacksmith/setup-node@v5 keep the same drop-in shape on Verself
  runners. Cache key is keyed by the package-lock.json content; restored
  bytes are tool-reconciled by `npm ci`.

inputs:
  node-version:
    description: Node.js version (passed to actions/setup-node).
    required: false
  node-version-file:
    description: Path to a file containing the Node.js version.
    required: false
  cache-dependency-path:
    description: Path to the lockfile used in the Checkpoint cache key.
    required: false
    default: package-lock.json
  registry-url:
    description: Optional registry URL passed to actions/setup-node.
    required: false
  always-auth:
    description: Whether always-auth is set in the registry config.
    required: false
    default: 'false'

outputs:
  node-version:
    description: The installed Node.js version.
    value: ${{ steps.setup.outputs.node-version }}
  cache-hit:
    description: true when the Checkpoint restored a generation.
    value: ${{ steps.npm-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: npm-cache
      uses: ./.github/actions/checkpoint
      with:
        key: verself-setup-node-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}
        path: ~/.npm
    - id: setup
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        registry-url: ${{ inputs.registry-url }}
        always-auth: ${{ inputs.always-auth }}

name: Verself Cache Bazel
description: |
  Mounts Verself Checkpoints for Bazel --disk_cache and --repository_cache
  at the locations configured in .bazelrc. Restored bytes are tool-
  reconciled by Bazel's content-addressed action keys; the v0 product
  contract recommends checkpointing disk_cache + repository_cache and
  avoiding output_base.

  Customers migrating from useblacksmith/cache-bazel keep the same
  drop-in shape. The action stays customer-authored so the cache shows
  up in Verself inventory and respects org/IAM scope.

inputs:
  workspace-files:
    description: |
      Files whose hash invalidates the Checkpoint cache key. Defaults to
      MODULE.bazel and MODULE.bazel.lock; pass WORKSPACE for legacy
      WORKSPACE-mode projects.
    required: false
    default: |
      MODULE.bazel
      MODULE.bazel.lock
  disk-cache-path:
    description: Mount point for --disk_cache.
    required: false
    default: ~/.cache/bazel-disk
  repository-cache-path:
    description: Mount point for --repository_cache.
    required: false
    default: ~/.cache/bazel-repo

outputs:
  disk-cache-hit:
    description: true when the disk cache Checkpoint restored a generation.
    value: ${{ steps.disk.outputs.cache-hit }}
  repository-cache-hit:
    description: true when the repository cache Checkpoint restored a generation.
    value: ${{ steps.repo.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: disk
      uses: guardian-intelligence/verself-checkpoint@v0
      with:
        key: verself-bazel-disk-${{ runner.os }}-${{ hashFiles(inputs.workspace-files) }}
        path: ${{ inputs.disk-cache-path }}
        size-gb: '50'
    - id: repo
      uses: guardian-intelligence/verself-checkpoint@v0
      with:
        key: verself-bazel-repo-v3-${{ runner.os }}-${{ hashFiles(inputs.workspace-files) }}
        path: ${{ inputs.repository-cache-path }}
        size-gb: '200'

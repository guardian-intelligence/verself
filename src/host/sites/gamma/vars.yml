---

verself_site: gamma
bare_metal_host_alias: vs-gamma-w0
bare_metal_public_ipv4: "{{ hostvars[groups['infra'][0]].ansible_host }}"
verself_domain: gamma.verself.sh
cloudflare_product_zone: verself.sh
verself_version: 0.1.0
verself_installation_id: inst_gamma_000000000000000000000000
verself_bin: /opt/verself/profile/bin
company_domain: guardianintelligence.org

billing_service_subdomain: billing.api
billing_service_domain: "{{ billing_service_subdomain }}.{{ verself_domain }}"
distribution_service_subdomain: distribution.api
distribution_service_domain: "{{ distribution_service_subdomain }}.{{ verself_domain }}"
forgejo_subdomain: git
forgejo_domain: "{{ forgejo_subdomain }}.{{ verself_domain }}"
governance_service_subdomain: governance.api
governance_service_domain: "{{ governance_service_subdomain }}.{{ verself_domain }}"
github_integration_service_subdomain: github.api
github_integration_service_domain: "{{ github_integration_service_subdomain }}.{{ verself_domain }}"
iam_service_subdomain: iam.api
iam_service_domain: "{{ iam_service_subdomain }}.{{ verself_domain }}"
email_service_subdomain: email.api
email_service_domain: "{{ email_service_subdomain }}.{{ verself_domain }}"
notifications_service_subdomain: notifications.api
notifications_service_domain: "{{ notifications_service_subdomain }}.{{ verself_domain }}"
npm_registry_subdomain: npm
npm_registry_domain: "{{ npm_registry_subdomain }}.{{ verself_domain }}"
pomerium_subdomain: access
pomerium_domain: "{{ pomerium_subdomain }}.{{ verself_domain }}"
profile_service_subdomain: profile.api
profile_service_domain: "{{ profile_service_subdomain }}.{{ verself_domain }}"
projects_service_subdomain: projects.api
projects_service_domain: "{{ projects_service_subdomain }}.{{ verself_domain }}"
resend_subdomain: notify
resend_domain: "{{ resend_subdomain }}.{{ verself_domain }}"
resend_sender_address: "noreply@{{ resend_domain }}"
resend_sender_name: verself
sandbox_rental_service_subdomain: sandbox.api
sandbox_rental_service_domain: "{{ sandbox_rental_service_subdomain }}.{{ verself_domain }}"
secrets_service_subdomain: secrets.api
secrets_service_domain: "{{ secrets_service_subdomain }}.{{ verself_domain }}"
source_code_hosting_service_subdomain: source.api
source_code_hosting_service_domain: "{{ source_code_hosting_service_subdomain }}.{{ verself_domain }}"
stalwart_subdomain: mail
stalwart_domain: "{{ stalwart_subdomain }}.{{ verself_domain }}"
zitadel_domain: "{{ verself_domain }}"

cloudflare_dns_records:
  - kind: browser_origin
    record: "@"
    zone: product
  - kind: public_api_origin
    record: billing.api
    zone: product
  - kind: public_api_origin
    record: distribution.api
    zone: product
  - kind: public_api_origin
    record: sandbox.api
    zone: product
  - kind: public_api_origin
    record: iam.api
    zone: product
  - kind: public_api_origin
    record: profile.api
    zone: product
  - kind: public_api_origin
    record: notifications.api
    zone: product
  - kind: public_api_origin
    record: projects.api
    zone: product
  - kind: public_api_origin
    record: source.api
    zone: product
  - kind: public_api_origin
    record: governance.api
    zone: product
  - kind: public_api_origin
    record: github.api
    zone: product
  - kind: public_api_origin
    record: secrets.api
    zone: product
  - kind: public_api_origin
    record: email.api
    zone: product
  - kind: operator_origin
    record: dashboard
    zone: product
  - kind: operator_origin
    record: access
    zone: product
  - kind: protocol_origin
    record: git
    zone: product
  - kind: protocol_origin
    record: mail
    zone: product
  - kind: protocol_origin
    record: npm
    zone: product

postgresql_host: 127.0.0.1
postgresql_port: 5432
postgresql_address: "{{ postgresql_host }}:{{ postgresql_port }}"
nomad_host: 127.0.0.1
nomad_http_port: 4646
nomad_http_address: "{{ nomad_host }}:{{ nomad_http_port }}"
nomad_artifact_bucket: nomad-artifacts
nomad_artifact_region: garage
nomad_artifact_getter_s3_environment_file: /etc/nomad/nomad-artifacts.env
nomad_artifact_getter_s3_access_key_env_var: AWS_ACCESS_KEY_ID
nomad_artifact_getter_s3_secret_key_env_var: AWS_SECRET_ACCESS_KEY
nomad_artifact_publisher_s3_environment_file: /etc/garage/nomad-artifacts/publisher.env
nomad_artifact_publisher_s3_access_key_env_var: VERSELF_NOMAD_ARTIFACTS_S3_ACCESS_KEY_ID
nomad_artifact_publisher_s3_secret_key_env_var: VERSELF_NOMAD_ARTIFACTS_S3_SECRET_ACCESS_KEY
firecracker_guest_pool_cidr: 172.16.0.0/16
firecracker_host_service_ip: 10.255.0.1
base_host_service_ip: "{{ firecracker_host_service_ip }}"
base_zfs_pools:
  - name: vspool
    mountpoint: /vspool
    devices:
      - /dev/nvme0n1

spire_agent_id: spiffe://spiffe.gamma.verself.sh/node/single-node
spire_agent_socket_path: /run/spire-agent/sockets/agent.sock
spire_bundle_endpoint_bind_address: 127.0.0.1
spire_bundle_endpoint_bind_port: 8082
spire_jwt_bundle_endpoint_url: https://127.0.0.1:8082
spire_jwt_issuer_url: https://127.0.0.1:8082
spire_server_bind_address: 127.0.0.1
spire_server_bind_port: 8081
spire_server_socket_path: /run/spire-server/private/api.sock
spire_trust_domain: spiffe.gamma.verself.sh
spire_workload_group: spire_workload

host_wireguard_tunnels:
  ops:
    address: 10.66.67.1
    address_prefix: 24
    interface: wg-ops
    network: 10.66.67.0/24
    peers: []
    port: 51821

dogfood_org_id: org_GAMMA000000000000000000000
service_discovery_canary_org_slug: guardian-intelligence
stalwart_operator_forward_to: ""

github_integration_service_github_app_id: 0
github_integration_service_github_app_slug: verself-runner-gamma
github_integration_service_github_app_client_id: ""
github_integration_service_github_app_settings_url: ""

---
# Install host OS packages. Runtime binaries are supplied by the Bazel-built
# server tools archive in static_binaries.yml.

- name: Bound apt network and lock waits
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/90verself-acquire-timeouts
    owner: root
    group: root
    mode: "0644"
    content: |
      Acquire::http::Timeout "5";
      Acquire::https::Timeout "5";
      Acquire::ftp::Timeout "5";
      Acquire::Retries "1";
      Acquire::ForceIPv4 "true";
      Acquire::Queue-Mode "access";
      DPkg::Lock::Timeout "60";

- name: Install substrate apt packages
  ansible.builtin.apt:
    name:
      - python3-psycopg2
      - wireguard-tools
      - git
      - ca-certificates
      - crun
      - curl
      - jq
      - openssl
      - python3
      - sqlite3
      - unzip
      - xz-utils
      - zstd
      - e2fsprogs
      - libjemalloc2
      - liblua5.4-0
      - libopentracing-c-wrapper0t64
    state: present
    update_cache: true
    cache_valid_time: 3600
    force_apt_get: true
    lock_timeout: 60

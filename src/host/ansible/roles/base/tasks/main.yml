---
# Base system configuration for all nodes.
# Host package installs here are bootstrap substrate only.

- name: Install base host packages
  ansible.builtin.apt:
    name:
      - zfsutils-linux
      - e2fsprogs
      - lld=1:18.0-59~exp2
      - lld-18=1:18.1.3-1ubuntu1
    state: present
    update_cache: true
    cache_valid_time: 3600
    force_apt_get: true
    lock_timeout: 60

- name: Block algif_aead autoload for Copy Fail
  ansible.builtin.copy:
    content: |
      # Managed by Verself host.
      # CVE-2026-31431 (Copy Fail): block AF_ALG AEAD autoload until the host kernel carries the upstream fix.
      blacklist algif_aead
      install algif_aead /bin/false
    dest: /etc/modprobe.d/cve-2026-31431-copy-fail.conf
    owner: root
    group: root
    mode: "0644"

- name: Unload algif_aead if already loaded
  community.general.modprobe:
    name: algif_aead
    state: absent

- name: Check Copy Fail algif_aead autoload hardening
  ansible.builtin.command: modprobe -n -v algif_aead
  register: base_copy_fail_algif_aead_modprobe
  changed_when: false
  failed_when: base_copy_fail_algif_aead_modprobe.stdout is not search('/bin/false')

- name: Create credstore parent directory
  ansible.builtin.file:
    path: /etc/credstore
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: Override systemd credential store tmpfiles mode
  ansible.builtin.copy:
    content: |
      # Managed by Verself host.
      # Systemd ships /usr/lib/tmpfiles.d/credstore.conf with /etc/credstore
      # at 0700. Verself stores per-service credentials under group-readable
      # subdirectories, so the parent must be traversable without being
      # listable.
      d /etc/credstore 0711 root root
      d /etc/credstore.encrypted 0700 root root
      z /run/credstore 0700 root root
      z /run/credstore.encrypted 0700 root root
    dest: /etc/tmpfiles.d/credstore.conf
    owner: root
    group: root
    mode: "0644"

- name: Create verself system config directory
  ansible.builtin.file:
    path: /etc/verself
    state: directory
    owner: root
    group: root
    # 0755 so substrate users can traverse
    # into their per-component config subdirs without needing
    # supplementary group membership on /etc/verself itself. The
    # contents stay tight: each subdirectory carries its own mode.
    mode: "0755"

- name: Write Verself site domain
  ansible.builtin.copy:
    content: "{{ verself_domain }}\n"
    dest: /etc/verself/domain
    owner: root
    group: root
    mode: "0644"

- name: Write Verself installation ID
  ansible.builtin.copy:
    content: "{{ verself_installation_id }}\n"
    dest: /etc/verself/installation-id
    owner: root
    group: root
    mode: "0644"

- name: Create workload system groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop: "{{ base_workload_users }}"

- name: Read existing passwd database
  ansible.builtin.getent:
    database: passwd

- name: Create workload system users
  ansible.builtin.user:
    name: "{{ item }}"
    group: "{{ item }}"
    home: "/var/lib/{{ item }}"
    shell: /usr/sbin/nologin
    create_home: false
    system: true
    state: present
  loop: "{{ base_workload_users }}"
  when: item not in ansible_facts.getent_passwd

- name: Create Firecracker jailer group
  ansible.builtin.group:
    name: "{{ base_firecracker_jailer_user }}"
    gid: "{{ base_firecracker_jailer_gid }}"
    state: present

- name: Create Firecracker jailer user
  ansible.builtin.user:
    name: "{{ base_firecracker_jailer_user }}"
    uid: "{{ base_firecracker_jailer_uid }}"
    group: "{{ base_firecracker_jailer_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    state: present
  when: base_firecracker_jailer_user not in ansible_facts.getent_passwd

- name: Create vm-orchestrator socket group
  ansible.builtin.group:
    name: "{{ base_vm_orchestrator_socket_group }}"
    system: true
    state: present

- name: Read vm-orchestrator socket group membership
  ansible.builtin.command:
    argv:
      - getent
      - group
      - "{{ base_vm_orchestrator_socket_group }}"
  register: base_vm_orchestrator_socket_group_getent
  changed_when: false

- name: Grant approved services vm-orchestrator socket access
  ansible.builtin.command:
    argv:
      - gpasswd
      - --add
      - "{{ item }}"
      - "{{ base_vm_orchestrator_socket_group }}"
  loop: "{{ base_vm_orchestrator_socket_members }}"
  changed_when: true
  when: >-
    base_vm_orchestrator_socket_group_getent.stdout
    is not regex('(^|[:,])' ~ item ~ '($|,)')

- name: Create vm-orchestrator state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/lib/verself, mode: "0755" }
    - { path: /var/lib/verself/vm-orchestrator, mode: "0755" }
    - { path: /var/lib/verself/vm-orchestrator/storage-keys, mode: "0700" }

- name: Configure host-service dummy interface
  ansible.builtin.copy:
    content: |
      # Managed by Verself host.
      [NetDev]
      Name={{ base_host_service_interface }}
      Kind=dummy
    dest: "/etc/systemd/network/20-{{ base_host_service_interface }}.netdev"
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-networkd

- name: Configure host-service address
  ansible.builtin.copy:
    content: |
      # Managed by Verself host.
      [Match]
      Name={{ base_host_service_interface }}

      [Network]
      Address={{ base_host_service_ip }}/32
      LinkLocalAddressing=no
      IPv6AcceptRA=no
    dest: "/etc/systemd/network/20-{{ base_host_service_interface }}.network"
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-networkd

- name: Ensure host-service network plane is active
  ansible.builtin.systemd:
    name: systemd-networkd
    enabled: true
    state: started

- name: Converge configured ZFS pools
  ansible.builtin.include_tasks: zfs-pool.yml
  loop: "{{ base_zfs_pools }}"
  loop_control:
    loop_var: base_zfs_pool

- name: Disable unsupported GSSAPIAuthentication in ssh_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/ssh_config
    regexp: '^\s*GSSAPIAuthentication'
    line: "    # GSSAPIAuthentication yes  # disabled — not supported by this SSH build"
    backrefs: false
  register: base_ssh_gssapi_update
  failed_when: false

- name: Harden sshd configuration
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd

# <verself_domain> resolves to 127.0.0.1 so on-host services that
# validate Zitadel-issued JWTs hit the local Zitadel for OIDC discovery
# instead of routing through Cloudflare. systemd-supervised services pick
# this up via per-unit BindReadOnlyPaths over a generated
# /etc/verself/auth-discovery-hosts file. Nomad raw_exec workloads have
# no mount-namespace facility, so we add the entry directly to the host
# /etc/hosts and let both supervisors resolve via the same file.
- name: Ensure <verself_domain> resolves to loopback in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 {{ verself_domain }}"
    regexp: '^127\.0\.0\.1\s+{{ verself_domain | regex_escape }}\s*$'
    state: present
    owner: root
    group: root
    mode: "0644"

---
# Dev tools install controls. Mirrors substrate_profile's defaults; the dev
# bridge consumes Bazel-managed dev_tools.tar.zst the same way substrate_profile
# consumes server_tools.tar.zst.
dev_tools_repo_root: "{{ playbook_dir }}/../../../.."
dev_tools_bazelisk: bazelisk
dev_tools_staging_dir: /opt/verself/dev-tools/staging
dev_tools_archive_marker_path: /opt/verself/dev-tools/.installed-version
dev_tools_archive_bazel_label: //src/tools/dev/binaries:dev_tools.tar.zst

# Apt-managed controller packages. These intentionally bypass content pinning;
# each entry records why Ubuntu archive integrity is acceptable for this host
# bootstrap-only channel.
dev_tools_system_packages:
  build-essential:
    risk_acknowledgement: >-
      build-essential is a Debian metapackage that has no version of its own;
      we accept upstream Ubuntu's archive integrity for the gcc/g++/make
      versions it pulls in.
    version_cmd: gcc --version
  crun:
    apt_version_constraint: 1.14.1
    risk_acknowledgement: >-
      crun is consumed by Firecracker tooling; we accept upstream Ubuntu's
      archive integrity in exchange for kernel-matched OCI runtime defaults
      that a Bazel http_file rule would not give us.
    version_cmd: crun --version
  debootstrap:
    apt_version_constraint: 1.0.134
    risk_acknowledgement: >-
      debootstrap is the bootstrap utility for guest rootfs builds; we accept
      upstream Ubuntu's archive integrity because the binary's only output is a
      chroot tree we then sha-pin downstream.
    version_cmd: debootstrap --version
  xdg-utils:
    risk_acknowledgement: >-
      xdg-utils ships xdg-open, the cross-DE default-app launcher invoked by
      browser-opening CLI tools such as Playwright and local auth helpers. We
      accept upstream Ubuntu's archive integrity for a thin shell-script
      package whose only role on operator devices is to dispatch URLs to
      whichever browser is registered.
    version_cmd: xdg-open --version

dev_tools_uv_tools:
  ansible-core:
    package: ansible-core
    version: 2.20.3
    with:
      - ansible-lint==26.4.0
  guarddog:
    package: guarddog
    version: 2.9.0
  pre-commit:
    package: pre-commit
    version: 4.5.1

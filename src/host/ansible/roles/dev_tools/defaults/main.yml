---
# Apt-managed controller packages. These intentionally bypass content pinning;
# each entry records why Ubuntu archive integrity is acceptable for this host
# bootstrap-only channel.
dev_tools_system_packages:
  build-essential:
    risk_acknowledgement: >-
      build-essential is a Debian metapackage that has no version of its own;
      we accept upstream Ubuntu's archive integrity for the gcc/g++/make
      versions it pulls in.
    version_cmd: gcc --version
  libffi-dev:
    risk_acknowledgement: >-
      libffi-dev provides headers for Ruby's fiddle extension. We accept
      upstream Ubuntu's archive integrity because the Ruby source archive is
      still sha-pinned by Bazel and this package only supplies OS ABI headers
      and libraries.
    version_cmd: pkg-config --modversion libffi
  libgdbm-dev:
    risk_acknowledgement: >-
      libgdbm-dev provides headers for Ruby's gdbm extension. We accept
      upstream Ubuntu's archive integrity because the Ruby source archive is
      still sha-pinned by Bazel and this package only supplies OS ABI headers
      and libraries.
    version_cmd: dpkg-query -W -f='${Version}\n' libgdbm-dev
  libncurses-dev:
    risk_acknowledgement: >-
      libncurses-dev provides terminal capability headers used by interactive
      Ruby tools. We accept upstream Ubuntu's archive integrity because the
      Ruby source archive is still sha-pinned by Bazel and this package only
      supplies OS ABI headers and libraries.
    version_cmd: ncursesw6-config --version
  libreadline-dev:
    risk_acknowledgement: >-
      libreadline-dev provides headers for Ruby's readline extension. We accept
      upstream Ubuntu's archive integrity because the Ruby source archive is
      still sha-pinned by Bazel and this package only supplies OS ABI headers
      and libraries.
    version_cmd: dpkg-query -W -f='${Version}\n' libreadline-dev
  libssl-dev:
    risk_acknowledgement: >-
      libssl-dev provides headers for Ruby's OpenSSL extension. We accept
      upstream Ubuntu's archive integrity because the Ruby source archive is
      still sha-pinned by Bazel and this package only supplies OS ABI headers
      and libraries.
    version_cmd: openssl version
  libyaml-dev:
    risk_acknowledgement: >-
      libyaml-dev provides headers for Ruby's psych YAML extension. We accept
      upstream Ubuntu's archive integrity because the Ruby source archive is
      still sha-pinned by Bazel and this package only supplies OS ABI headers
      and libraries.
    version_cmd: dpkg-query -W -f='${Version}\n' libyaml-dev
  zlib1g-dev:
    risk_acknowledgement: >-
      zlib1g-dev provides headers for Ruby's zlib extension and RubyGems
      archive handling. We accept upstream Ubuntu's archive integrity because
      the Ruby source archive is still sha-pinned by Bazel and this package
      only supplies OS ABI headers and libraries.
    version_cmd: dpkg-query -W -f='${Version}\n' zlib1g-dev
  crun:
    apt_version_constraint: 1.14.1
    risk_acknowledgement: >-
      crun is consumed by Firecracker tooling; we accept upstream Ubuntu's
      archive integrity in exchange for kernel-matched OCI runtime defaults
      that a Bazel http_file rule would not give us.
    version_cmd: crun --version
  debootstrap:
    apt_version_constraint: 1.0.134
    risk_acknowledgement: >-
      debootstrap is the bootstrap utility for guest rootfs builds; we accept
      upstream Ubuntu's archive integrity because the binary's only output is a
      chroot tree we then sha-pin downstream.
    version_cmd: debootstrap --version
  xdg-utils:
    risk_acknowledgement: >-
      xdg-utils ships xdg-open, the cross-DE default-app launcher invoked by
      browser-opening CLI tools such as Playwright and local auth helpers. We
      accept upstream Ubuntu's archive integrity for a thin shell-script
      package whose only role on operator devices is to dispatch URLs to
      whichever browser is registered.
    version_cmd: xdg-open --version

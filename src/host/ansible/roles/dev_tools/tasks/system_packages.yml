---
# Install apt-managed system packages declared by the dev_tools role.
# These intentionally bypass content pinning — each entry's
# `risk_acknowledgement` documents why we accept upstream Ubuntu's
# archive integrity instead of sha256-pinning the binary.
#
# This is the only Ansible-side delivery channel for controller package
# installs; repo tools are resolved by Bazel at the command boundary.

- name: Install system packages via apt
  ansible.builtin.apt:
    name: "{{ dev_tools_system_packages | dict2items | map(attribute='key') | list }}"
    state: present
    update_cache: true

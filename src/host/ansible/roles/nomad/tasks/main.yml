---
# Nomad single-node supervisor (server + client co-resident).
# config lives at /etc/nomad/nomad.hcl, state at /var/lib/nomad. The HTTP
# API binds loopback-only — operator access flows over wg-ops / SSH-
# forwarded loopback, never the public interface.

- name: Capture Nomad version
  ansible.builtin.command:
    cmd: "{{ verself_bin }}/nomad version"
  register: nomad_version_output
  changed_when: false

- name: Assert Nomad version matches server-tools pin
  ansible.builtin.assert:
    that: "'Nomad v' + nomad_expected_version in nomad_version_output.stdout"
    fail_msg: >-
      Expected Nomad v{{ nomad_expected_version }},
      got: {{ nomad_version_output.stdout_lines[0] }}

- name: Create Nomad configuration directory
  ansible.builtin.file:
    path: "{{ nomad_config_dir }}"
    state: directory
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0750"

- name: Load Nomad artifact getter credentials
  ansible.builtin.include_vars:
    file: "{{ verself_site_secret_vars_file }}"
  when: verself_site_secret_vars_file | default('', true) | length > 0
  no_log: true

- name: Deploy Nomad artifact getter environment
  ansible.builtin.copy:
    dest: "{{ nomad_artifact_getter_s3_environment_file }}"
    owner: root
    group: "{{ nomad_group }}"
    mode: "0640"
    content: |
      {{ nomad_artifact_getter_s3_access_key_env_var }}={{ nomad_artifact_getter_s3_access_key_id }}
      {{ nomad_artifact_getter_s3_secret_key_env_var }}={{ nomad_artifact_getter_s3_secret_access_key }}
      AWS_REGION={{ nomad_artifact_region }}
      AWS_EC2_METADATA_DISABLED=true
  when:
    - nomad_artifact_getter_s3_access_key_id | default('', true) | length > 0
    - nomad_artifact_getter_s3_secret_access_key | default('', true) | length > 0
    - nomad_artifact_region | default('', true) | length > 0
  notify: restart nomad
  no_log: true

- name: Remove stale Nomad artifact getter environment when credentials are absent
  ansible.builtin.file:
    path: "{{ nomad_artifact_getter_s3_environment_file }}"
    state: absent
  when: >-
    nomad_artifact_getter_s3_access_key_id | default('', true) | length == 0
    or nomad_artifact_getter_s3_secret_access_key | default('', true) | length == 0
    or nomad_artifact_region | default('', true) | length == 0
  notify: restart nomad
  no_log: true

- name: Create bootstrap substrate seed directory
  ansible.builtin.file:
    path: "{{ nomad_openbao_runtime_seed_dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Assert OpenBao site root key input
  ansible.builtin.assert:
    that:
      - verself_openbao_site_root_key_file | default('', true) | length > 0
    fail_msg: >-
      OpenBao bootstrap requires verself_openbao_site_root_key_file. Provide
      the site root key before host convergence.
  no_log: true

- name: Deploy OpenBao site root key
  ansible.builtin.copy:
    src: "{{ verself_openbao_site_root_key_file }}"
    dest: "{{ nomad_openbao_root_key_dest }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy filtered OpenBao runtime seed
  ansible.builtin.copy:
    src: "{{ verself_openbao_runtime_seed_file }}"
    dest: "{{ nomad_openbao_runtime_seed_dest }}"
    owner: root
    group: root
    mode: "0600"
  when: verself_openbao_runtime_seed_file | default('', true) | length > 0
  no_log: true

- name: Create Nomad state directory
  ansible.builtin.file:
    path: "{{ nomad_data_dir }}"
    state: directory
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    # 0711: traverse-only for non-root. Required so raw_exec tasks
    # running as a non-root user (e.g. profile_service uid 965) can
    # chdir into <data_dir>/alloc/<id>/<task>/ and execve the binary.
    # 0700 silently fails with "fork/exec ...: permission denied"
    # because the unprivileged uid can't traverse the path. Listing
    # is still denied (no read bit for `other`); only traverse leaks.
    # Refs: hashicorp/nomad#10850, #17871, discuss/16597.
    mode: "0711"

# Derive the node's x86-64 psABI microarchitecture level (x86-64-v2/v3/v4) from
# its own CPU flags. This is the capability placement actually pins on (it is what
# glibc-hwcaps and -march builds dispatch on) and it is deterministic from the
# flag set, so it replaces any hand-set, drift-prone microarch label.
- name: Read host CPU flags
  ansible.builtin.slurp:
    src: /proc/cpuinfo
  register: nomad_cpuinfo

- name: Derive x86-64 psABI level from CPU flags
  ansible.builtin.set_fact:
    nomad_node_cpu_isa_level: >-
      {%- set flags = ((nomad_cpuinfo.content | b64decode).split('\n') | select('match', '^flags') | list | first | default('')).split() -%}
      {%- if 'avx512f' in flags and 'avx512bw' in flags and 'avx512cd' in flags and 'avx512dq' in flags and 'avx512vl' in flags -%}x86-64-v4
      {%- elif 'avx2' in flags and 'bmi1' in flags and 'bmi2' in flags and 'fma' in flags and 'f16c' in flags and 'movbe' in flags -%}x86-64-v3
      {%- elif 'sse4_2' in flags and 'sse4_1' in flags and 'ssse3' in flags and 'popcnt' in flags -%}x86-64-v2
      {%- else -%}x86-64-v1
      {%- endif -%}

- name: Deploy Nomad agent configuration
  ansible.builtin.template:
    src: nomad.hcl.j2
    dest: "{{ nomad_config_dir }}/nomad.hcl"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0640"
  notify: restart nomad

- name: Deploy Nomad systemd unit
  ansible.builtin.template:
    src: nomad.service.j2
    dest: /etc/systemd/system/nomad.service
    owner: root
    group: root
    mode: "0644"
  notify: restart nomad

- name: Apply Nomad unit and config changes before readiness
  ansible.builtin.meta: flush_handlers

- name: Enable and start nomad
  ansible.builtin.systemd:
    name: nomad
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Nomad HTTP API
  ansible.builtin.wait_for:
    host: "{{ nomad_host }}"
    port: "{{ nomad_http_port }}"
    timeout: 30

- name: Wait for Nomad to leave bootstrapping
  ansible.builtin.uri:
    url: "http://{{ nomad_http_address }}/v1/agent/health"
    method: GET
    status_code: 200
  register: nomad_health
  retries: 30
  delay: 1
  until: nomad_health.status == 200

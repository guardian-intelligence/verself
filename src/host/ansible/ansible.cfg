[defaults]
# Inventory is supplied by `verself-deploy`; setting a default here would mask
# configuration errors.
#
# Host bootstrap is an operator-run Ansible surface. Deployment evidence comes
# from OpenTelemetry spans emitted by the deploy tool and Nomad components.
roles_path = ../../infrastructure-components:../../integrations/zitadel/roles:../../integrations/resend/domain-bootstrap:../../substrate/vm-orchestrator/host/ansible/roles:roles
library = plugins/modules
action_plugins = plugins/action
filter_plugins = plugins/filter
callbacks_enabled = ansible.posix.profile_tasks
host_key_checking = False
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 86400
vars_plugins_enabled = host_group_vars,community.sops.sops

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o ControlPath=~/.ssh/sockets/%r@%h-%p -o IPQoS=none -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ConnectTimeout=10
pipelining = True

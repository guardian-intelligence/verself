---
- name: Resolve component auth project audience
  ansible.builtin.set_fact:
    component_auth_project_id: "{{ component_auth_project_ids_by_name.get(component.workload.auth.project_name, '') }}"
    component_auth_credential_group: >-
      {{
        component.workload.auth.credstore_group
        | default(component.workload.units[0].group | default(component.workload.units[0].user))
      }}
    component_auth_credential_path: >-
      {{
        component.workload.auth.credential_path
        | default('/etc/credstore/' ~ (component.name | replace('_', '-')) ~ '/auth-audience')
      }}
  no_log: true

- name: Assert component auth project was reconciled
  ansible.builtin.assert:
    that:
      - component_auth_project_id | length > 0
    fail_msg: "Zitadel project {{ component.workload.auth.project_name }} was not reconciled before component substrate execution."
  no_log: true

- name: Write component auth audience credential
  ansible.builtin.copy:
    content: "{{ component_auth_project_id }}\n"
    dest: "{{ component_auth_credential_path }}"
    owner: root
    group: "{{ component_auth_credential_group }}"
    mode: "0640"
  no_log: true

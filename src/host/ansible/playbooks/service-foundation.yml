---
- name: "Site secrets"
  hosts: infra
  gather_facts: false
  vars_files:
    - "../../sites/{{ verself_site | default('prod') }}/vars.yml"
  tasks:
    - name: Load site secrets
      ansible.builtin.import_tasks: tasks/site-secrets.yml

- name: "Service host foundation"
  hosts: infra
  become: true
  gather_facts: false
  vars_files:
    - "../../sites/{{ verself_site | default('prod') }}/vars.yml"
  vars:
    # Anchor declaration discovery to authored source, independent of the
    # playbook subprocess cwd chosen by the Aspect task wrapper.
    verself_repo_root: "{{ playbook_dir | dirname | dirname | dirname | dirname }}"
    clickhouse_client_ca_source: /etc/clickhouse-server/tls/server-ca.pem
    verself_owner_declaration_roots:
      - "{{ verself_repo_root }}/src/services"
      - "{{ verself_repo_root }}/src/infrastructure-components"
      - "{{ verself_repo_root }}/src/websites/apps"
    postgresql_declaration_suffix: "/deploy/postgres[.]yml$"
    clickhouse_client_declaration_suffix: "/deploy/clickhouse-client[.]yml$"
    openbao_runtime_secret_declaration_suffix: "/deploy/runtime-secrets[.]yml$"
    haproxy_public_route_declaration_suffix: "/deploy/public-routes[.]yml$"
  tasks:
    - name: Assert SPIRE identity registry input
      ansible.builtin.assert:
        that:
          - spire_registrations_file is defined
          - spire_registrations_file | length > 0
        fail_msg: "service-foundation.yml requires spire_registrations_file."

    - name: Converge service SPIRE identities
      ansible.builtin.include_role:
        name: spire_registrations

    - name: Initialize owner-local foundation declarations
      ansible.builtin.set_fact:
        postgresql_service_databases: []
        postgresql_replication_roles: []
        postgresql_logical_publications: []
        postgresql_peer_mappings:
          - { system_user: postgres, pg_user: postgres }
        clickhouse_client_ca_credentials: []
        openbao_runtime_secret_seed_declarations: []
        haproxy_public_routes: []
        haproxy_public_apis: []

    - name: Discover owner-local foundation declaration files
      ansible.builtin.find:
        paths: "{{ verself_owner_declaration_roots }}"
        file_type: file
        recurse: true
        patterns:
          - postgres.yml
          - clickhouse-client.yml
          - runtime-secrets.yml
          - public-routes.yml
      delegate_to: localhost
      become: false
      register: owner_local_foundation_declaration_find

    - name: Classify owner-local foundation declaration files
      ansible.builtin.set_fact:
        owner_local_foundation_declaration_files: "{{ owner_local_foundation_declaration_find.files | map(attribute='path') | list }}"

    - name: Publish typed owner-local foundation declaration lists
      ansible.builtin.set_fact:
        postgresql_declaration_files: >-
          {{
            owner_local_foundation_declaration_files
            | select('search', postgresql_declaration_suffix)
            | list
            | sort
          }}
        clickhouse_client_declaration_files: >-
          {{
            owner_local_foundation_declaration_files
            | select('search', clickhouse_client_declaration_suffix)
            | list
            | sort
          }}
        openbao_runtime_secret_declaration_files: >-
          {{
            owner_local_foundation_declaration_files
            | select('search', openbao_runtime_secret_declaration_suffix)
            | list
            | sort
          }}
        haproxy_public_route_declaration_files: >-
          {{
            owner_local_foundation_declaration_files
            | select('search', haproxy_public_route_declaration_suffix)
            | list
            | sort
          }}

    - name: Load owner-local PostgreSQL declarations
      ansible.builtin.set_fact:
        postgresql_service_databases: >-
          {{
            postgresql_service_databases
            + ((lookup('ansible.builtin.file', item) | from_yaml).postgresql_service_databases | default([]))
          }}
        postgresql_peer_mappings: >-
          {{
            postgresql_peer_mappings
            + ((lookup('ansible.builtin.file', item) | from_yaml).postgresql_peer_mappings | default([]))
          }}
        postgresql_replication_roles: >-
          {{
            postgresql_replication_roles
            + ((lookup('ansible.builtin.file', item) | from_yaml).postgresql_replication_roles | default([]))
          }}
        postgresql_logical_publications: >-
          {{
            postgresql_logical_publications
            + ((lookup('ansible.builtin.file', item) | from_yaml).postgresql_logical_publications | default([]))
          }}
      loop: "{{ postgresql_declaration_files }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert owner-local PostgreSQL declarations are well formed
      ansible.builtin.assert:
        that:
          - postgresql_service_databases | length > 0
          - postgresql_peer_mappings | length > 1
          - postgresql_service_databases | selectattr('name', 'defined') | list | length == postgresql_service_databases | length
          - postgresql_service_databases | selectattr('owner', 'defined') | list | length == postgresql_service_databases | length
          - postgresql_peer_mappings | selectattr('system_user', 'defined') | list | length == postgresql_peer_mappings | length
          - postgresql_peer_mappings | selectattr('pg_user', 'defined') | list | length == postgresql_peer_mappings | length
          - postgresql_service_databases | map(attribute='name') | unique | list | length == postgresql_service_databases | length
          - postgresql_replication_roles | selectattr('name', 'defined') | list | length == postgresql_replication_roles | length
          - postgresql_replication_roles | selectattr('password_file', 'defined') | list | length == postgresql_replication_roles | length
          - postgresql_replication_roles | map(attribute='name') | unique | list | length == postgresql_replication_roles | length
          - postgresql_logical_publications | selectattr('database', 'defined') | list | length == postgresql_logical_publications | length
          - postgresql_logical_publications | selectattr('publication', 'defined') | list | length == postgresql_logical_publications | length
          - postgresql_logical_publications | selectattr('publication_owner', 'defined') | list | length == postgresql_logical_publications | length
          - postgresql_logical_publications | selectattr('table_owner', 'defined') | list | length == postgresql_logical_publications | length
          - postgresql_logical_publications | selectattr('replication_role', 'defined') | list | length == postgresql_logical_publications | length
          - postgresql_logical_publications | selectattr('tables', 'defined') | list | length == postgresql_logical_publications | length
          - >-
            (postgresql_logical_publications
            | map(attribute='replication_role')
            | list
            | difference(postgresql_replication_roles | map(attribute='name') | list)
            | length) == 0
        fail_msg: "Owner-local PostgreSQL deploy declarations are missing or malformed."

    - name: Assert owner-local PostgreSQL replication role declarations are well formed
      ansible.builtin.assert:
        that:
          - item.name is match('^[a-z][a-z0-9_]*$')
          - item.password_file is match('^/')
          - item.connection_limit | default(15) | int > 0
        fail_msg: "Owner-local PostgreSQL replication role declaration is malformed."
      loop: "{{ postgresql_replication_roles }}"
      loop_control:
        label: "{{ item.name | default('unnamed-replication-role') }}"

    - name: Assert owner-local PostgreSQL logical publication declarations are well formed
      ansible.builtin.assert:
        that:
          - item.database is match('^[a-z][a-z0-9_]*$')
          - item.publication is match('^[a-z][a-z0-9_]*$')
          - item.publication_owner is match('^[a-z][a-z0-9_]*$')
          - item.table_owner is match('^[a-z][a-z0-9_]*$')
          - item.replication_role is match('^[a-z][a-z0-9_]*$')
          - item.publication_owner == item.replication_role
          - item.tables | length > 0
          - item.tables | select('match', '^[a-z][a-z0-9_]*$') | list | length == item.tables | length
        fail_msg: "Owner-local PostgreSQL logical publication declaration is malformed."
      loop: "{{ postgresql_logical_publications }}"
      loop_control:
        label: "{{ item.publication | default('unnamed-publication') }}"

    - name: Converge PostgreSQL local service databases
      ansible.builtin.include_role:
        name: postgresql

    - name: Load owner-local ClickHouse client declarations
      ansible.builtin.set_fact:
        clickhouse_client_ca_credentials: >-
          {{
            clickhouse_client_ca_credentials
            + ((lookup('ansible.builtin.file', item) | from_yaml).clickhouse_client_ca_credentials | default([]))
          }}
      loop: "{{ clickhouse_client_declaration_files }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert owner-local ClickHouse client declarations are well formed
      ansible.builtin.assert:
        that:
          - clickhouse_client_ca_credentials | length > 0
          - clickhouse_client_ca_credentials | selectattr('path', 'defined') | list | length == clickhouse_client_ca_credentials | length
          - clickhouse_client_ca_credentials | selectattr('group', 'defined') | list | length == clickhouse_client_ca_credentials | length
          - clickhouse_client_ca_credentials | map(attribute='path') | unique | list | length == clickhouse_client_ca_credentials | length
        fail_msg: "Owner-local ClickHouse client deploy declarations are missing or malformed."

    - name: Converge ClickHouse client CA credential directories
      ansible.builtin.file:
        path: "{{ item.path | dirname }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "0750"
      loop: "{{ clickhouse_client_ca_credentials }}"
      loop_control:
        label: "{{ item.path | dirname }}"

    - name: Converge ClickHouse client CA credentials
      ansible.builtin.copy:
        src: "{{ clickhouse_client_ca_source }}"
        dest: "{{ item.path }}"
        remote_src: true
        owner: root
        group: "{{ item.group }}"
        mode: "0640"
      loop: "{{ clickhouse_client_ca_credentials }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Load owner-local OpenBao runtime-secret declarations
      ansible.builtin.set_fact:
        openbao_runtime_secret_seed_declarations: >-
          {{
            openbao_runtime_secret_seed_declarations
            + ((lookup('ansible.builtin.file', item) | from_yaml).openbao_runtime_secret_seed_declarations | default([]))
          }}
      loop: "{{ openbao_runtime_secret_declaration_files }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: Assert owner-local OpenBao runtime-secret declaration set is well formed
      ansible.builtin.assert:
        that:
          - openbao_runtime_secret_seed_declarations | length > 0
          - openbao_runtime_secret_seed_declarations | selectattr('name', 'defined') | list | length == openbao_runtime_secret_seed_declarations | length
          - openbao_runtime_secret_seed_declarations | map(attribute='name') | unique | list | length == openbao_runtime_secret_seed_declarations | length
        fail_msg: "Owner-local OpenBao runtime-secret deploy declarations are missing or malformed."
      no_log: true

    - name: Assert owner-local OpenBao runtime-secret value sources are well formed
      ansible.builtin.assert:
        that:
          - item.name | length > 0
          - >-
            ([
              item.site_secret is defined,
              item.value is defined,
              item.file is defined
            ] | select('equalto', true) | list | length) == 1
        fail_msg: "Owner-local OpenBao runtime-secret deploy declarations must set exactly one of site_secret, value, or file."
      loop: "{{ openbao_runtime_secret_seed_declarations }}"
      loop_control:
        label: "{{ item.name | default('unnamed-runtime-secret') }}"
      no_log: true

    - name: Converge OpenBao platform runtime secrets
      ansible.builtin.import_tasks: tasks/openbao-runtime-secrets.yml

    - name: Load owner-local HAProxy public route declarations
      ansible.builtin.set_fact:
        haproxy_public_routes: >-
          {{
            haproxy_public_routes
            + ((lookup('ansible.builtin.template', item) | from_yaml).haproxy_public_routes | default([]))
          }}
        haproxy_public_apis: >-
          {{
            haproxy_public_apis
            + ((lookup('ansible.builtin.template', item) | from_yaml).haproxy_public_apis | default([]))
          }}
      loop: "{{ haproxy_public_route_declaration_files }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert owner-local HAProxy public route declarations are well formed
      ansible.builtin.assert:
        that:
          - haproxy_public_routes | length > 0
          - haproxy_public_apis | length > 0
          - haproxy_public_routes | selectattr('host', 'defined') | list | length == haproxy_public_routes | length
          - haproxy_public_routes | selectattr('backend', 'defined') | list | length == haproxy_public_routes | length
          - haproxy_public_apis | selectattr('key', 'defined') | list | length == haproxy_public_apis | length
          - haproxy_public_apis | selectattr('host', 'defined') | list | length == haproxy_public_apis | length
          - haproxy_public_apis | selectattr('path_prefix', 'defined') | list | length == haproxy_public_apis | length
          - haproxy_public_routes | map(attribute='host') | unique | list | length == haproxy_public_routes | length
          - haproxy_public_apis | map(attribute='key') | unique | list | length == haproxy_public_apis | length
        fail_msg: "Owner-local HAProxy public route deploy declarations are missing or malformed."

    - name: Converge HAProxy public service routing
      ansible.builtin.include_role:
        name: haproxy

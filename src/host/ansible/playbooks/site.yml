---
- name: "Site secrets"
  hosts: all
  gather_facts: false
  vars_files:
    - "../../sites/{{ verself_site | default('prod') }}/vars.yml"
  tags:
    - always
  tasks:
    - name: Load site secrets
      ansible.builtin.import_tasks: tasks/site-secrets.yml

- name: "Preflight: controller prerequisites"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "../../sites/{{ verself_site | default('prod') }}/vars.yml"
  tags:
    - preflight
    - controller
  tasks:
    - name: Run controller preflight checks
      ansible.builtin.import_tasks: tasks/controller-preflight.yml

- name: "Host bootstrap foundation"
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - "../../sites/{{ verself_site | default('prod') }}/vars.yml"
  tags:
    - bootstrap
    - foundation
  roles:
    - role: base
      tags:
        - base
        - packages

- name: "Nomad bootstrap"
  hosts: infra
  become: true
  gather_facts: false
  vars_files:
    - "../../sites/{{ verself_site | default('prod') }}/vars.yml"
  tags:
    - bootstrap
    - nomad
    - scheduler
  roles:
    - role: nomad
      tags:
        - nomad
        - scheduler

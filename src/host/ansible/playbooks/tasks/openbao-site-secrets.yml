---
- name: Normalize OpenBao site secret names
  ansible.builtin.set_fact:
    openbao_site_secret_names_normalized: >-
      {{
        site_secret_names
        | default([])
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | sort
        | list
      }}
  no_log: true

- name: Assert OpenBao site secret inputs
  ansible.builtin.assert:
    that:
      - openbao_site_secret_names_normalized | length > 0
      - openbao_site_config_kv_mount | length > 0
    fail_msg: "OpenBao site secret loading requires site_secret_names and openbao_site_config_kv_mount."
  no_log: true

- name: Read OpenBao root token for site secret loading
  ansible.builtin.slurp:
    src: "{{ openbao_credstore_dir }}/root-token"
  register: openbao_site_secret_root_token_raw
  no_log: true

- name: Read OpenBao site secrets
  ansible.builtin.uri:
    url: "https://{{ openbao_api_address }}/v1/{{ openbao_site_config_kv_mount }}/data/config/{{ item }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_site_secret_root_token_raw.content | b64decode | trim }}"
    ca_path: "{{ openbao_tls_dir }}/cert.pem"
    status_code: 200
    return_content: true
  loop: "{{ openbao_site_secret_names_normalized }}"
  loop_control:
    label: "{{ item }}"
  register: openbao_site_secret_reads
  no_log: true

- name: Assert OpenBao site secret values are present
  ansible.builtin.assert:
    that:
      - item.json.data.data.value is defined
      - item.json.data.data.value | string | length > 0
    fail_msg: "OpenBao site secret {{ item.item }} is missing a non-empty value."
  loop: "{{ openbao_site_secret_reads.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Publish OpenBao site secrets as Ansible facts
  ansible.builtin.set_fact:
    "{{ item.item }}": "{{ item.json.data.data.value }}"
  loop: "{{ openbao_site_secret_reads.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

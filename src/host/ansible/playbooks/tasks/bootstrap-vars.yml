---
- name: Load explicit bootstrap vars
  ansible.builtin.include_vars:
    file: "{{ verself_bootstrap_vars_file }}"
  when: verself_bootstrap_vars_file | default('', true) | length > 0
  no_log: true

- name: Require explicit bootstrap vars
  ansible.builtin.fail:
    msg: >-
      {{ verself_site }} must pass verself_bootstrap_vars_file generated by
      aspect site materialize-seed. Site bootstrap does not read encrypted host secret files.
  when:
    - verself_bootstrap_vars_file | default('', true) | length == 0

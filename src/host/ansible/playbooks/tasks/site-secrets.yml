---
- name: Load explicit bootstrap site secrets
  ansible.builtin.include_vars:
    file: "{{ verself_site_secret_vars_file }}"
  when: verself_site_secret_vars_file | default('', true) | length > 0
  no_log: true

- name: Reject implicit non-prod SOPS secrets
  ansible.builtin.fail:
    msg: >-
      {{ verself_site }} must pass verself_site_secret_vars_file generated by
      aspect site materialize-seed. New site bootstrap does not read SOPS files.
  when:
    - verself_site_secret_vars_file | default('', true) | length == 0
    - verself_site | default('prod') != 'prod'

- name: Load legacy prod host-stage site secrets
  community.sops.load_vars:
    file: "../../sites/{{ verself_site }}/secrets/host.sops.yml"
  when:
    - verself_site_secret_vars_file | default('', true) | length == 0
    - verself_site | default('prod') == 'prod'
  no_log: true

- name: Load legacy prod external-service site secrets
  community.sops.load_vars:
    file: "../../sites/{{ verself_site }}/secrets/external.sops.yml"
  when:
    - verself_site_secret_vars_file | default('', true) | length == 0
    - verself_site | default('prod') == 'prod'
  no_log: true

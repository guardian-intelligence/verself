---
# Install controller dev tools from role-local defaults and Bazel-owned archives.
# Usage: aspect dev install
# This playbook takes no inventory because it runs pre-provision on a fresh controller.
- name: Set up verself development environment
  hosts: localhost
  connection: local
  become: true
  vars:
    # Use system Python, not Nix Python, so pip/apt modules work correctly.
    ansible_python_interpreter: /usr/bin/python3
  roles:
    - role: dev_tools
      tags: [dev_tools]

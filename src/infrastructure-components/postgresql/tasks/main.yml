---
# PostgreSQL database server.

- name: Capture PostgreSQL version
  ansible.builtin.command:
    cmd: "{{ verself_bin }}/postgres --version"
  environment:
    LD_LIBRARY_PATH: "{{ postgresql_runtime_ld_library_path }}"
  register: postgresql_version_output
  changed_when: false

- name: Assert PostgreSQL version matches expected
  ansible.builtin.assert:
    that: "'16.' in postgresql_version_output.stdout"
    fail_msg: >-
      Expected PostgreSQL 16.x, got: {{ postgresql_version_output.stdout }}.
      Update the host PostgreSQL role and pinned server tool together.

# --- System user ---

- name: Create postgres system group
  ansible.builtin.group:
    name: postgres
    system: true

- name: Create postgres system user
  ansible.builtin.user:
    name: postgres
    group: postgres
    system: true
    home: /var/lib/postgresql
    shell: /bin/bash
    create_home: true

# --- Directories ---

- name: Create PostgreSQL directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - "{{ postgresql_data_dir }}"
    - "{{ postgresql_config_dir }}"

- name: Create PostgreSQL log directory
  ansible.builtin.file:
    # The setgid bit keeps new collector-readable log files in group adm even
    # though postgres runs with primary group postgres.
    path: "{{ postgresql_log_dir }}"
    state: directory
    owner: postgres
    group: adm
    mode: "2755"

- name: Create PostgreSQL run directory
  ansible.builtin.file:
    path: /var/run/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

# --- Idempotent initdb ---

- name: Check if PostgreSQL data directory is initialized
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/PG_VERSION"
  register: postgresql_data_stat

- name: Write temporary password file for initdb
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null length=64 chars=ascii_letters,digits') }}"
    dest: /tmp/.pg_initdb_pw
    owner: postgres
    group: postgres
    mode: "0600"
  when: not postgresql_data_stat.stat.exists
  no_log: true

- name: Initialize PostgreSQL data directory
  ansible.builtin.command:
    cmd: >-
      {{ verself_bin }}/initdb
      --pgdata={{ postgresql_data_dir }}
      --auth=scram-sha-256
      --encoding=UTF8
      --locale=C.UTF-8
      -L {{ postgresql_runtime_share_dir }}
      --pwfile=/tmp/.pg_initdb_pw
  become: true
  become_user: postgres
  environment:
    HOME: /tmp
    LD_LIBRARY_PATH: "{{ postgresql_runtime_ld_library_path }}"
  changed_when: true
  when: not postgresql_data_stat.stat.exists

- name: Remove temporary password file
  ansible.builtin.file:
    path: /tmp/.pg_initdb_pw
    state: absent

# --- Configuration ---

- name: Deploy postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ postgresql_config_dir }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  register: postgresql_conf_template

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_config_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  register: postgresql_hba_template

- name: Deploy pg_ident.conf
  ansible.builtin.template:
    src: pg_ident.conf.j2
    dest: "{{ postgresql_config_dir }}/pg_ident.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  register: postgresql_ident_template

# --- Readiness gate ---

- name: Wait for PostgreSQL to be ready
  ansible.builtin.wait_for:
    port: "{{ postgresql_port }}"
    host: "{{ postgresql_host }}"
    timeout: 30

- name: Reload PostgreSQL local auth configuration
  community.postgresql.postgresql_query:
    query: SELECT pg_reload_conf()
    login_unix_socket: /var/run/postgresql
    login_user: postgres
    trust_input: false
  become: true
  become_user: postgres
  changed_when: false

# --- Local service databases ---

- name: Ensure local service PostgreSQL roles exist
  community.postgresql.postgresql_user:
    name: "{{ item.owner }}"
    role_attr_flags: LOGIN
    login_unix_socket: /var/run/postgresql
    login_user: postgres
    trust_input: false
  become: true
  become_user: postgres
  loop: "{{ postgresql_service_databases }}"
  loop_control:
    label: "{{ item.owner }}"

- name: Ensure local service PostgreSQL databases exist
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner }}"
    login_unix_socket: /var/run/postgresql
    login_user: postgres
    trust_input: false
  become: true
  become_user: postgres
  loop: "{{ postgresql_service_databases }}"
  loop_control:
    label: "{{ item.name }}"

# --- Owner-local logical replication publications ---

- name: Read logical replication PostgreSQL role password files
  ansible.builtin.slurp:
    src: "{{ item.password_file }}"
  loop: "{{ postgresql_replication_roles }}"
  loop_control:
    label: "{{ item.name }}"
  register: postgresql_replication_role_password_reads
  no_log: true

- name: Ensure logical replication PostgreSQL roles exist
  community.postgresql.postgresql_user:
    name: "{{ item.item.name }}"
    password: "{{ item.content | b64decode | trim }}"
    role_attr_flags: LOGIN,REPLICATION
    conn_limit: "{{ item.item.connection_limit | default(15) }}"
    login_unix_socket: /var/run/postgresql
    login_user: postgres
    trust_input: false
  become: true
  become_user: postgres
  loop: "{{ postgresql_replication_role_password_reads.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true

- name: Ensure published table ownership stays with service owner
  community.postgresql.postgresql_owner:
    login_db: "{{ item.0.database }}"
    obj_name: "{{ item.1 }}"
    obj_type: table
    new_owner: "{{ item.0.table_owner }}"
    login_unix_socket: /var/run/postgresql
    login_user: postgres
    trust_input: false
  become: true
  become_user: postgres
  loop: "{{ postgresql_logical_publications | subelements('tables') }}"
  loop_control:
    label: "{{ item.0.database }}.{{ item.1 }}"

- name: Ensure published tables use full replica identity
  community.postgresql.postgresql_query:
    login_db: "{{ item.0.database }}"
    query: ALTER TABLE public."{{ item.1 }}" REPLICA IDENTITY FULL
    login_unix_socket: /var/run/postgresql
    login_user: postgres
    trust_input: false
  become: true
  become_user: postgres
  loop: "{{ postgresql_logical_publications | subelements('tables') }}"
  loop_control:
    label: "{{ item.0.database }}.{{ item.1 }}"
  changed_when: false

- name: Grant replication roles database connect access
  community.postgresql.postgresql_privs:
    login_db: "{{ item.database }}"
    type: database
    objs: "{{ item.database }}"
    privs: CONNECT
    roles: "{{ item.replication_role }}"
    login_unix_socket: /var/run/postgresql
    login_user: postgres
    trust_input: false
  become: true
  become_user: postgres
  loop: "{{ postgresql_logical_publications }}"
  loop_control:
    label: "{{ item.database }}:{{ item.replication_role }}"

- name: Grant replication roles usage on public schema
  community.postgresql.postgresql_privs:
    login_db: "{{ item.database }}"
    type: schema
    objs: public
    privs: USAGE
    roles: "{{ item.replication_role }}"
    login_unix_socket: /var/run/postgresql
    login_user: postgres
    trust_input: false
  become: true
  become_user: postgres
  loop: "{{ postgresql_logical_publications }}"
  loop_control:
    label: "{{ item.database }}:{{ item.replication_role }}"

- name: Grant replication roles read access to published tables
  community.postgresql.postgresql_privs:
    login_db: "{{ item.0.database }}"
    type: table
    schema: public
    objs: "{{ item.1 }}"
    privs: SELECT
    roles: "{{ item.0.replication_role }}"
    login_unix_socket: /var/run/postgresql
    login_user: postgres
    trust_input: false
  become: true
  become_user: postgres
  loop: "{{ postgresql_logical_publications | subelements('tables') }}"
  loop_control:
    label: "{{ item.0.database }}.{{ item.1 }}:{{ item.0.replication_role }}"

- name: Ensure owner-local logical replication publications exist
  community.postgresql.postgresql_publication:
    login_db: "{{ item.database }}"
    name: "{{ item.publication }}"
    owner: "{{ item.publication_owner }}"
    tables: "{{ item.tables | map('regex_replace', '^', 'public.') | list }}"
    login_unix_socket: /var/run/postgresql
    login_user: postgres
    trust_input: false
  become: true
  become_user: postgres
  loop: "{{ postgresql_logical_publications }}"
  loop_control:
    label: "{{ item.database }}:{{ item.publication }}"

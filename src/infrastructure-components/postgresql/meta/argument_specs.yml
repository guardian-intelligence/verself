---
argument_specs:
  main:
    short_description: "PostgreSQL database server"
    description:
      - "Deploys PostgreSQL. Initializes the data"
      - "directory (idempotent), configures listen address and auth,"
      - "and creates application databases and users."
      - "The bootstrap listener is a host site fact."
    options:
      postgresql_data_dir:
        type: path
        default: /var/lib/postgresql/16/verself
        description: "PostgreSQL data directory."

      postgresql_config_dir:
        type: path
        default: /etc/postgresql/verself
        description: "PostgreSQL configuration directory."

      postgresql_log_dir:
        type: path
        default: /var/log/postgresql
        description: "PostgreSQL log directory."

      postgresql_runtime_root:
        type: path
        default: /opt/verself/postgresql
        description: "Bazel-installed PostgreSQL runtime root."

      postgresql_runtime_lib_dir:
        type: path
        default: /opt/verself/postgresql/usr/lib/x86_64-linux-gnu
        description: "Directory containing PostgreSQL runtime shared libraries."

      postgresql_runtime_pg_lib_dir:
        type: path
        default: /opt/verself/postgresql/usr/lib/postgresql/16/lib
        description: "Directory containing PostgreSQL extension libraries."

      postgresql_runtime_share_dir:
        type: path
        default: /opt/verself/postgresql/usr/share/postgresql/16
        description: "Directory containing PostgreSQL initdb share files."

      postgresql_runtime_ld_library_path:
        type: str
        default: /opt/verself/postgresql/usr/lib/x86_64-linux-gnu:/opt/verself/postgresql/usr/lib/postgresql/16/lib
        description: "LD_LIBRARY_PATH used to execute the Bazel-installed PostgreSQL binaries."

      verself_bin:
        type: path
        required: true
        description: "Path to the server binary directory."

      postgresql_service_databases:
        type: list
        elements: dict
        default: []
        description: "Owner-local service database declarations."

      postgresql_replication_roles:
        type: list
        elements: dict
        default: []
        description: "Owner-local logical replication role declarations."

      postgresql_logical_publications:
        type: list
        elements: dict
        default: []
        description: "Owner-local logical replication publication declarations."

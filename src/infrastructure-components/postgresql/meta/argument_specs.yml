---
argument_specs:
  main:
    short_description: "PostgreSQL database server"
    description:
      - "Deploys PostgreSQL. Initializes the data"
      - "directory (idempotent), configures listen address and auth,"
      - "and creates application databases and users."
      - "The bootstrap listener is a host site fact."
    options:
      postgresql_data_dir:
        type: path
        default: /var/lib/postgresql/16/verself
        description: "PostgreSQL data directory."

      postgresql_config_dir:
        type: path
        default: /etc/postgresql/verself
        description: "PostgreSQL configuration directory."

      postgresql_log_dir:
        type: path
        default: /var/log/postgresql
        description: "PostgreSQL log directory."

      postgresql_bin_dir:
        type: path
        default: /opt/verself/postgresql/usr/lib/postgresql/16/bin
        description: "Path to the Bazel-owned PostgreSQL binary directory."

      postgresql_share_dir:
        type: path
        default: /opt/verself/postgresql/usr/share/postgresql/16
        description: "Path to the Bazel-owned PostgreSQL share directory."

      postgresql_lib_dir:
        type: path
        default: /opt/verself/postgresql/usr/lib/x86_64-linux-gnu
        description: "Path to the Bazel-owned PostgreSQL library directory."

---
- name: Create Stalwart recovery secret directory
  ansible.builtin.file:
    path: /var/lib/verself/recovery/stalwart
    state: directory
    owner: root
    group: stalwart
    mode: "0750"

- name: Deploy stalwart admin password credential
  ansible.builtin.copy:
    content: "{{ stalwart_admin_password }}"
    dest: /var/lib/verself/recovery/stalwart/admin-password
    owner: root
    group: stalwart
    mode: "0640"
  no_log: true

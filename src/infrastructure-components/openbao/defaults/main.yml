---
openbao_config_dir: /etc/openbao
openbao_hosts_file: "{{ openbao_config_dir }}/hosts"
openbao_tls_dir: /etc/openbao/tls
openbao_data_dir: /var/lib/openbao
openbao_raft_dir: /var/lib/openbao/raft
openbao_log_dir: /var/log/openbao
openbao_audit_log: /var/log/openbao/audit.log
openbao_credstore_dir: /etc/credstore/openbao
openbao_node_id: verself-single-node
openbao_host: 127.0.0.1
openbao_api_port: 8200
openbao_cluster_port: 8201
openbao_api_address: "{{ openbao_host }}:{{ openbao_api_port }}"
openbao_cluster_address: "{{ openbao_host }}:{{ openbao_cluster_port }}"
openbao_api_bind_address: "0.0.0.0:{{ openbao_api_port }}"
openbao_cluster_bind_address: "{{ openbao_cluster_address }}"
openbao_rebootstrap: false
openbao_rebootstrap_confirm: ""
openbao_key_shares: 3
openbao_key_threshold: 2
openbao_oidc_loopback_hosts:
  - "{{ verself_domain }}"
openbao_spiffe_jwt_mount: spiffe-jwt
openbao_spiffe_jwt_jwks_url: "{{ spire_jwt_bundle_endpoint_url }}"
openbao_spiffe_jwt_jwks_ca_pem_path: /etc/spire/bundle-endpoint/ca.pem
openbao_workload_audience: openbao
openbao_workload_token_ttl: 15m
openbao_workload_token_max_ttl: 1h
openbao_runtime_secret_namespace: runtime
openbao_runtime_secret_kv_mount_prefix: kv
openbao_runtime_secret_consumer_subject: "{{ (spire_registrations_spiffe_ids | default({}))['secrets_service.default'] | default('spiffe://' ~ spire_trust_domain ~ '/svc/secrets-service') }}"
openbao_runtime_secret_force: false
openbao_credential_org_ids:
  - "{{ dogfood_org_id }}"
openbao_credential_kv_mount_prefix: kv
openbao_credential_transit_mount_prefix: transit
openbao_credential_consumer_subject: "{{ (spire_registrations_spiffe_ids | default({}))['secrets_service.default'] | default('spiffe://' ~ spire_trust_domain ~ '/svc/secrets-service') }}"
openbao_audit_request_headers:
  - name: X-Verself-Request-Id
    hmac: false
openbao_site_config_kv_mount: site-config

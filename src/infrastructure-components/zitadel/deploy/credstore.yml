# Host credstore material for "Sign in with GitHub". The Verself Runner GitHub
# App's user-to-server OAuth credentials are read by the auth-control-plane
# batch job to register (and reconcile) the Zitadel GitHub identity provider.
#
# These are materialized by host convergence before deploy; the full zitadel
# Ansible role is NOT part of the deploy path, so the
# credentials must be declared here rather than rendered by that role. The
# client id is public (carried in site vars.yml); the client secret lives in
# OpenBao site configuration. Absent/empty values fail host convergence loudly.
credstore_secret_files:
  - path: /etc/credstore/zitadel/github-login-client-id
    group: zitadel
    site_secret: github_integration_service_github_app_client_id
    mode: "0640"
  - path: /etc/credstore/zitadel/github-login-client-secret
    group: zitadel
    site_secret: github_integration_service_github_app_oauth_client_secret
    mode: "0640"

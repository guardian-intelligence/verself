---
argument_specs:
  main:
    short_description: "Zitadel identity provider"
    description:
      - "Deploys Zitadel. Creates the PostgreSQL"
      - "database and user, generates the masterkey, and runs start-from-init"
      - "(idempotent first-run)."
      - "Exports OTel traces to the collector on localhost:4317."
      - "Service ports are component defaults or Nomad service registrations."
    options:
      zitadel_config_dir:
        type: path
        default: /etc/zitadel
        description: "Zitadel configuration directory."

      zitadel_domain:
        type: str
        description: "Public issuer and protocol domain for Zitadel."

      verself_bin:
        type: path
        required: true
        description: "Path to the server binary directory."

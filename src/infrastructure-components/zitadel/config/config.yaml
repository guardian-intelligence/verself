Log:
  Level: info
  Formatter:
    Format: json

Port: 8085
ExternalPort: 443
ExternalSecure: true

TLS:
  Enabled: false

Database:
  postgres:
    Host: /var/run/postgresql
    Port: 5432
    Database: zitadel
    User:
      Username: zitadel
      Password: ""
      SSL:
        Mode: disable
    MaxOpenConns: 10
    MaxIdleConns: 5
    MaxConnLifetime: 30m

DefaultInstance:
  Features:
    LoginV2:
      Required: false
  DomainPolicy:
    SMTPSenderAddressMatchesInstanceDomain: false
  LabelPolicy:
    DisableWatermark: true
    HideLoginNameSuffix: true
  LoginPolicy:
    AllowRegister: false

Machine:
  Identification:
    PrivateIp:
      Enabled: false
    Hostname:
      Enabled: true

Instrumentation:
  Trace:
    Exporter:
      Type: grpc
      Endpoint: 127.0.0.1:4317
      Insecure: true
    Fraction: 1
  Metrics:
    Enabled: true

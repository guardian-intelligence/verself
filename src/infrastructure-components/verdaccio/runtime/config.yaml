# Verdaccio npm registry mirror.

storage: /var/lib/verdaccio/storage

auth:
  htpasswd:
    file: /var/lib/verdaccio/htpasswd
    algorithm: bcrypt
    rounds: 10
    max_users: 0

web:
  enable: false

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: true
    maxage: 30m
    strict_ssl: true

packages:
  '**':
    access: $all
    publish: $nobody
    unpublish: $nobody
    proxy: npmjs

max_body_size: 100mb
listen: 127.0.0.1:4873

# Supply-chain gating via @verdaccio/package-filter. The plugin rewrites
# uplink manifests before they reach clients: filtered versions disappear from
# package metadata resolution.
filters:
  '@verdaccio/package-filter':
    minAgeDays: 3

# Structured JSON logs over stdout -> journald -> otelcol -> ClickHouse.
log:
  type: stdout
  format: json
  level: http
  redact:
    paths:
      - req.header.authorization
      - req.header.cookie
    censor: '<redacted>'

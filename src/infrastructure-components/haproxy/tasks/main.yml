---
# HAProxy public edge with lego-managed DNS-01 certificates.

- name: Create HAProxy system group
  ansible.builtin.group:
    name: haproxy
    system: true

- name: Create HAProxy system user
  ansible.builtin.user:
    name: haproxy
    group: haproxy
    groups: adm
    append: true
    system: true
    home: /var/lib/haproxy
    shell: /usr/sbin/nologin
    create_home: false

- name: Create HAProxy directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ haproxy_config_dir }}", owner: root, group: haproxy, mode: "0750" }
    - { path: "{{ haproxy_cert_dir }}", owner: root, group: haproxy, mode: "0750" }
    - { path: "{{ haproxy_map_dir }}", owner: root, group: haproxy, mode: "0750" }
    - { path: "{{ haproxy_credstore_dir }}", owner: root, group: haproxy, mode: "0750" }
    - { path: "{{ haproxy_lego_path }}", owner: root, group: haproxy, mode: "0750" }
    - { path: /var/lib/haproxy, owner: haproxy, group: haproxy, mode: "0750" }
    - { path: "{{ haproxy_log_dir }}", owner: haproxy, group: adm, mode: "2750" }

# HAProxy creates shm-stats-file during validation; an empty precreated file SIGBUSes in 3.3.7.

- name: Create well-known publication directory
  ansible.builtin.file:
    path: "{{ haproxy_well_known_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Inspect Verself CLI OIDC client ID
  ansible.builtin.stat:
    path: "{{ haproxy_verself_cli_client_id_path }}"
  register: haproxy_verself_cli_client_id_stat

- name: Read Verself CLI OIDC client ID
  ansible.builtin.slurp:
    src: "{{ haproxy_verself_cli_client_id_path }}"
  register: haproxy_verself_cli_client_id_raw
  no_log: true
  when: haproxy_verself_cli_client_id_stat.stat.exists

- name: Inspect Verself product API audience
  ansible.builtin.stat:
    path: "{{ haproxy_verself_product_api_audience_path }}"
  register: haproxy_verself_product_api_audience_stat

- name: Read Verself product API audience
  ansible.builtin.slurp:
    src: "{{ haproxy_verself_product_api_audience_path }}"
  register: haproxy_verself_product_api_audience_raw
  no_log: true
  when: haproxy_verself_product_api_audience_stat.stat.exists

- name: Resolve Verself discovery public auth identifiers
  ansible.builtin.set_fact:
    haproxy_verself_cli_client_id: >-
      {{
        haproxy_verself_cli_client_id_raw.content | default('') | b64decode | trim
        if haproxy_verself_cli_client_id_stat.stat.exists
        else ''
      }}
    haproxy_verself_product_api_audience: >-
      {{
        haproxy_verself_product_api_audience_raw.content | default('') | b64decode | trim
        if haproxy_verself_product_api_audience_stat.stat.exists
        else ''
      }}
  no_log: true

- name: Publish Verself discovery manifest
  ansible.builtin.template:
    src: verself-discovery.json.j2
    dest: "{{ haproxy_verself_discovery_manifest_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: reload haproxy

- name: Store Cloudflare DNS token for lego
  ansible.builtin.copy:
    content: "{{ cloudflare_api_token }}\n"
    dest: "{{ haproxy_cloudflare_token_path }}"
    owner: root
    group: haproxy
    mode: "0640"
  no_log: true

- name: Create Verself PKI directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/verself/pki, group: root, mode: "0755" }
    - { path: /etc/verself/pki/private, group: haproxy, mode: "0750" }

- name: Require billing webhook DNS to remain DNS-only
  ansible.builtin.assert:
    that: not (cloudflare_proxied | default(false) | bool)
    fail_msg: >-
      billing webhook origin IP allowlisting requires billing DNS to remain
      DNS-only (cloudflare_proxied=false). Move the allowlist to the
      Cloudflare edge before enabling orange-cloud proxying.

- name: Assert Stripe webhook IP list parsed
  ansible.builtin.assert:
    that:
      - haproxy_stripe_webhook_ips | length > 0
      - haproxy_stripe_webhook_ips | select('string') | list | length == haproxy_stripe_webhook_ips | length
    fail_msg: >-
      haproxy_stripe_webhook_ips must contain the published Stripe webhook source IPs.

- name: Install HAProxy placeholder certificates for first config validation
  ansible.builtin.include_tasks: placeholder_cert.yml
  loop: "{{ haproxy_public_certificates }}"
  loop_control:
    loop_var: haproxy_public_certificate
    label: "{{ haproxy_public_certificate.name }}"

- name: Deploy HAProxy public host map
  ansible.builtin.template:
    src: public-hosts.map.j2
    dest: "{{ haproxy_map_dir }}/public-hosts.map"
    owner: root
    group: haproxy
    mode: "0640"
  notify: reload haproxy

- name: Deploy HAProxy Nomad upstream backend config
  ansible.builtin.template:
    src: nomad-upstreams.cfg.j2
    dest: "{{ haproxy_nomad_upstreams_config }}"
    owner: root
    group: haproxy
    mode: "0640"
    force: false

- name: Deploy HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_config_dir }}/haproxy.cfg"
    owner: root
    group: haproxy
    mode: "0640"
    # Ansible stages the template under the SSH user's private tmpdir; validate a service-owned copy.
    validate: >-
      /bin/sh -ec
      'tmp="$(/usr/bin/mktemp /var/lib/haproxy/haproxy-validate.XXXXXX.cfg)";
      trap "rm -f \"$tmp\"" EXIT;
      /usr/bin/install -o haproxy -g haproxy -m 0640 "$1" "$tmp";
      cd /;
      /usr/bin/sudo -u haproxy /usr/bin/env LD_LIBRARY_PATH={{ haproxy_runtime_library_path }} {{ verself_bin }}/haproxy -c -f "$tmp" -f {{ haproxy_nomad_upstreams_config }}'
      -- %s
  notify: restart haproxy

- name: Deploy HAProxy systemd unit
  ansible.builtin.template:
    src: haproxy.service.j2
    dest: /etc/systemd/system/haproxy.service
    mode: "0644"
  register: haproxy_systemd_unit
  notify: restart haproxy

- name: Deploy HAProxy lego renew systemd service
  ansible.builtin.template:
    src: haproxy-lego-renew.service.j2
    dest: /etc/systemd/system/haproxy-lego-renew.service
    mode: "0644"
  register: haproxy_lego_renew_service

- name: Deploy HAProxy lego renew systemd timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Renew HAProxy TLS certificates with lego

      [Timer]
      Persistent=true
      OnCalendar=*-*-* 03:35:00
      RandomizedDelaySec=1h

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/haproxy-lego-renew.timer
    mode: "0644"
  register: haproxy_lego_renew_timer

- name: Reload systemd manager after HAProxy unit changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    haproxy_systemd_unit.changed
    or haproxy_lego_renew_service.changed
    or haproxy_lego_renew_timer.changed

- name: Issue or renew HAProxy public certificates
  ansible.builtin.command:
    argv: "{{ haproxy_lego_argv }}"
  environment:
    CF_DNS_API_TOKEN_FILE: "{{ haproxy_cloudflare_token_path }}"
    CLOUDFLARE_PROPAGATION_TIMEOUT: "600"
    CLOUDFLARE_POLLING_INTERVAL: "5"
  changed_when: true
  vars:
    haproxy_lego_argv: >-
      {{
        haproxy_lego_base_argv
        + haproxy_lego_wait_argv
        + haproxy_lego_disable_ans_argv
        + haproxy_lego_dns_resolver_argv
        + haproxy_lego_domain_argv
        + haproxy_lego_split_argv
      }}
    haproxy_lego_base_argv:
      - "{{ verself_bin }}/haproxy-lego-renew"
      - --lego-bin
      - "{{ verself_bin }}/lego"
      - --haproxy-bin
      - "{{ verself_bin }}/haproxy"
      - --haproxy-config
      - "{{ haproxy_config_dir }}/haproxy.cfg"
      - --haproxy-config
      - "{{ haproxy_nomad_upstreams_config }}"
      - --haproxy-ld-library-path
      - "{{ haproxy_runtime_library_path }}"
      - --lego-path
      - "{{ haproxy_lego_path }}"
      - --email
      - "{{ haproxy_lego_email }}"
      - --cert-name
      - "{{ item.name }}"
      - --pem-out
      - "{{ item.pem_path }}"
      - --pem-group
      - haproxy
      - --reload-unit
      - haproxy.service
    haproxy_lego_wait_argv: >-
      {{
        ['--dns-propagation-wait', haproxy_lego_dns_propagation_wait]
        if haproxy_lego_dns_propagation_wait | default('0s') != '0s'
        else []
      }}
    haproxy_lego_disable_ans_argv: >-
      {{
        ['--dns-propagation-disable-ans']
        if haproxy_lego_dns_propagation_disable_ans
        and (haproxy_lego_dns_propagation_wait | default('0s')) == '0s'
        else []
      }}
    haproxy_lego_dns_resolver_argv: "{{ haproxy_lego_dns_resolvers | map('regex_replace', '^(.*)$', '--dns-resolver=\\1') | list }}"
    haproxy_lego_domain_argv: "{{ item.domains | map('regex_replace', '^(.*)$', '--domain=\\1') | list }}"
    haproxy_lego_split_argv: >-
      {{
        [
          '--split-cert-out', item.split_cert_path,
          '--split-key-out', item.split_key_path,
          '--split-group', item.split_group | default('stalwart')
        ]
        if item.split_cert_path is defined and item.split_key_path is defined else []
      }}
  loop: "{{ haproxy_public_certificates }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Apply HAProxy unit and config changes before readiness
  ansible.builtin.meta: flush_handlers

- name: Enable and start HAProxy
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: started
    daemon_reload: true

- name: Enable HAProxy lego renew timer
  ansible.builtin.systemd:
    name: haproxy-lego-renew.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for HAProxy HTTPS listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 443
    timeout: 30

---
- name: Check HAProxy active before restart
  listen: restart haproxy
  ansible.builtin.command: systemctl is-active --quiet haproxy
  register: haproxy_restart_active
  changed_when: false
  failed_when: haproxy_restart_active.rc not in [0, 3]

- name: Restart HAProxy when active
  listen: restart haproxy
  ansible.builtin.systemd:
    daemon_reload: true
    name: haproxy
    state: restarted
  when: haproxy_restart_active.rc == 0

- name: Check HAProxy active before reload
  listen: reload haproxy
  ansible.builtin.command: systemctl is-active --quiet haproxy
  register: haproxy_reload_active
  changed_when: false
  failed_when: haproxy_reload_active.rc not in [0, 3]

- name: Reload HAProxy when active
  listen: reload haproxy
  ansible.builtin.systemd:
    daemon_reload: true
    name: haproxy
    state: reloaded
  when: haproxy_reload_active.rc == 0

---
haproxy_config_dir: /etc/haproxy
haproxy_nomad_upstreams_config: "{{ haproxy_config_dir }}/nomad-upstreams.cfg"
haproxy_cert_dir: /etc/haproxy/certs
haproxy_map_dir: /etc/haproxy/maps
haproxy_log_dir: /var/log/haproxy
haproxy_shm_stats_file: /var/lib/haproxy/edge-stats.shm
haproxy_well_known_dir: /var/www/verself/.well-known
haproxy_verself_discovery_manifest_path: "{{ haproxy_well_known_dir }}/verself"
haproxy_iam_service_state_dir: /var/lib/verself/bootstrap/iam-service
haproxy_verself_cli_client_id_path: "{{ haproxy_iam_service_state_dir }}/oidc-cli-client-id"
haproxy_verself_product_api_audience_path: "{{ haproxy_iam_service_state_dir }}/auth-audience"
haproxy_runtime_library_path: /opt/verself/profile/lib/haproxy
haproxy_global_maxconn: 20000
haproxy_public_frontend_maxconn: 12000
haproxy_internal_frontend_maxconn: 2000
haproxy_metrics_frontend_maxconn: 20
haproxy_hsts_header: "max-age=31536000"
haproxy_public_rate_window: 10s
haproxy_public_rate_limit: 30000
haproxy_auth_rate_limit: 4000
haproxy_webhook_rate_limit: 12000
haproxy_npm_registry_domain: "{{ npm_registry_domain | default('npm.' ~ verself_domain) }}"
haproxy_npm_registry_rate_limit: 2000
haproxy_stick_table_size: 100k
haproxy_stick_table_expire: 10m

haproxy_public_certificates:
  - name: "{{ verself_domain }}"
    domains:
      - "{{ verself_domain }}"
      - "*.{{ verself_domain }}"
      - "*.api.{{ verself_domain }}"
    pem_path: "{{ haproxy_cert_dir }}/{{ verself_domain }}.pem"
    split_cert_path: "{{ stalwart_tls_cert_dir | default('/etc/stalwart/certs') }}/cert.pem"
    split_key_path: "{{ stalwart_tls_cert_dir | default('/etc/stalwart/certs') }}/key.pem"
    split_group: stalwart
  - name: "{{ company_domain }}"
    domains:
      - "{{ company_domain }}"
    pem_path: "{{ haproxy_cert_dir }}/{{ company_domain }}.pem"

haproxy_stripe_webhook_ips:

haproxy_firecracker_host_service_interface: "{{ firecracker_host_service_interface | default('verself-host0') }}"
haproxy_firecracker_host_service_ip: "{{ firecracker_host_service_ip | default('10.255.0.1') }}"
haproxy_metrics_address: 127.0.0.1:8404

haproxy_h2c_components:

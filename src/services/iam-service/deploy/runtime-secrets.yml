openbao_runtime_secret_declarations:
  - name: iam-service.email_identity.hmac_key
    job_id: iam-service
    generated:
      bytes: 64
      encoding: base64url
  - name: iam-service.spicedb.grpc_preshared_key
    job_id: iam-service
    consumer_job_ids: [spicedb]
    generated:
      bytes: 32
      encoding: base64url
  - name: iam-service.zitadel.admin_token
    job_id: iam-service
    produced_by_job: zitadel
  - name: iam-service.zitadel.auth_audience
    job_id: iam-service
    produced_by_job: auth-control-plane
    consumer_job_ids:
      - analytics-service
      - billing
      - email-service
      - github-integration
      - governance-service
      - notifications-service
      - object-storage-service
      - profile-service
      - projects-service
      - sandbox-rental
      - secrets-service
      - source-code-hosting-service
  - name: iam-service.zitadel.oidc_app_id
    job_id: iam-service
    produced_by_job: auth-control-plane
  - name: iam-service.zitadel.oidc_client_id
    job_id: iam-service
    produced_by_job: auth-control-plane
  - name: iam-service.zitadel.oidc_client_secret
    job_id: iam-service
    produced_by_job: auth-control-plane
  - name: iam-service.zitadel.oidc_project_id
    job_id: iam-service
    produced_by_job: auth-control-plane
  - name: iam-service.zitadel.oidc_cli_app_id
    job_id: iam-service
    produced_by_job: auth-control-plane
  - name: iam-service.zitadel.oidc_cli_client_id
    job_id: iam-service
    produced_by_job: auth-control-plane
  - name: iam-service.zitadel.oidc_cli_project_id
    job_id: iam-service
    produced_by_job: auth-control-plane
  - name: iam-service.zitadel.action_signing_key
    job_id: iam-service
    produced_by_job: auth-control-plane
  - name: iam-service.zitadel.github_login_idp_id
    job_id: iam-service
    produced_by_job: auth-control-plane

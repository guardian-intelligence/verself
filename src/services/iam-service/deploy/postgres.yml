postgresql_service_databases:
  - { name: iam_service, owner: iam_service }
postgresql_peer_mappings:
  - { system_user: iam_service, pg_user: iam_service }
postgresql_logical_publications:
  - database: iam_service
    publication: electric_publication_iam
    publication_owner: electric_iam
    table_owner: iam_service
    replication_role: electric_iam
    tables:
      - iam_web_auth_clients
      - iam_web_auth_accounts
      - iam_web_auth_account_sessions
      - iam_web_device_login_requests

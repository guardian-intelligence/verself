---
deployment_promotion_gates:
  - name: email_resend_domain
    kind: provider
    size: medium
    evidence_query: |
      SELECT count()
      FROM verself_deploy.canary_events_v1
      WHERE site = {site:String}
        AND deploy_run_key = {deploy_run_key:String}
        AND component = 'email_service'
        AND status = 'succeeded'
    timeout: 45s
  - name: email_resend_send
    kind: provider
    size: medium
    evidence_query: |
      SELECT count()
      FROM verself_deploy.canary_events_v1
      WHERE site = {site:String}
        AND deploy_run_key = {deploy_run_key:String}
        AND component = 'email_service'
        AND status = 'succeeded'
    timeout: 45s

postgresql_service_databases:
  - { name: governance_service, owner: governance_service }
postgresql_peer_mappings:
  - { system_user: governance_service, pg_user: governance_service }
  - system_user: governance_service
    pg_user: iam_service
    purpose: data_export
    justification: governance exports read identity rows until those projections move behind service-owned export APIs
  - system_user: governance_service
    pg_user: billing
    purpose: data_export
    justification: governance exports read billing rows until those projections move behind service-owned export APIs
  - system_user: governance_service
    pg_user: sandbox_rental
    purpose: data_export
    justification: governance exports read sandbox rows until those projections move behind service-owned export APIs

---
# Firecracker host setup: KVM, jailer user/dirs, host networking, and guest
# image staging checks. The daemon and composable image seeding are owned by
# the component-local vm-orchestrator Nomad job.

- name: Build Firecracker release archive with Bazel
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.command:
    argv:
      - "{{ firecracker_bazelisk }}"
      - build
      - "{{ firecracker_release_bazel_label }}"
    chdir: "{{ firecracker_monorepo_root }}"
  changed_when: false

- name: Resolve Bazel execution root
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.command:
    argv:
      - "{{ firecracker_bazelisk }}"
      - info
      - execution_root
    chdir: "{{ firecracker_monorepo_root }}"
  changed_when: false
  register: firecracker_bazel_execution_root

- name: Resolve Firecracker release archive output path
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.command:
    argv:
      - "{{ firecracker_bazelisk }}"
      - cquery
      - --output=files
      - "{{ firecracker_release_bazel_label }}"
    chdir: "{{ firecracker_monorepo_root }}"
  changed_when: false
  register: firecracker_release_bazel_output

- name: Set Firecracker release archive facts
  ansible.builtin.set_fact:
    firecracker_release_local_archive: >-
      {{ firecracker_bazel_execution_root.stdout | trim
      }}/{{ firecracker_release_bazel_output.stdout | trim }}
    firecracker_release_filename: "{{ firecracker_release_bazel_output.stdout | trim | basename }}"

- name: Assert Firecracker release archive filename is parseable
  ansible.builtin.assert:
    that:
      - firecracker_release_filename is match('^firecracker-v.+-[A-Za-z0-9_]+\\.tgz$')
    fail_msg: >-
      Expected Firecracker release archive filename like
      firecracker-v<version>-<arch>.tgz, got {{ firecracker_release_filename }}.

- name: Inspect Firecracker release archive produced by Bazel
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.stat:
    path: "{{ firecracker_release_local_archive }}"
    checksum_algorithm: sha256
  register: firecracker_release_archive_stat
  failed_when: not firecracker_release_archive_stat.stat.exists

- name: Set Firecracker version pins
  ansible.builtin.set_fact:
    firecracker_version_pins:
      version: >-
        {{ firecracker_release_filename
        | regex_replace('^firecracker-v(.+)-[A-Za-z0-9_]+\\.tgz$', '\\1') }}
      arch: >-
        {{ firecracker_release_filename
        | regex_replace('^firecracker-v.+-([A-Za-z0-9_]+)\\.tgz$', '\\1') }}

- name: Set Firecracker release paths
  ansible.builtin.set_fact:
    firecracker_release_archive: "{{ firecracker_release_remote_tmp }}/{{ firecracker_release_filename }}"
    firecracker_release_dir: >-
      {{ firecracker_release_remote_tmp
      }}/firecracker-release-{{ firecracker_version_pins.version
      }}-{{ firecracker_version_pins.arch }}

- name: Upload Firecracker release archive
  ansible.builtin.copy:
    src: "{{ firecracker_release_local_archive }}"
    dest: "{{ firecracker_release_archive }}"
    mode: "0644"

- name: Create Firecracker extraction directory
  ansible.builtin.file:
    path: "{{ firecracker_release_dir }}"
    state: directory
    mode: "0755"

- name: Extract Firecracker release archive
  ansible.builtin.unarchive:
    src: "{{ firecracker_release_archive }}"
    dest: "{{ firecracker_release_dir }}"
    remote_src: true

- name: Install pinned Firecracker binary
  ansible.builtin.copy:
    src: >-
      {{
        firecracker_release_dir
        ~ '/release-v'
        ~ firecracker_version_pins.version
        ~ '-'
        ~ firecracker_version_pins.arch
        ~ '/firecracker-v'
        ~ firecracker_version_pins.version
        ~ '-'
        ~ firecracker_version_pins.arch
      }}
    dest: /usr/local/bin/firecracker
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Install pinned jailer binary
  ansible.builtin.copy:
    src: >-
      {{
        firecracker_release_dir
        ~ '/release-v'
        ~ firecracker_version_pins.version
        ~ '-'
        ~ firecracker_version_pins.arch
        ~ '/jailer-v'
        ~ firecracker_version_pins.version
        ~ '-'
        ~ firecracker_version_pins.arch
      }}
    dest: /usr/local/bin/jailer
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Verify installed Firecracker version
  ansible.builtin.command: /usr/local/bin/firecracker --version
  register: firecracker_installed_version
  changed_when: false
  failed_when: "'v' + firecracker_version_pins.version not in firecracker_installed_version.stdout"

# --- KVM ---

- name: Detect KVM module for CPU vendor
  ansible.builtin.set_fact:
    firecracker_kvm_module: >-
      {{
        'kvm_amd'
        if 'AuthenticAMD' in (ansible_facts.processor | default([]) | join(' '))
        else 'kvm_intel'
      }}

# modprobe can return non-zero when KVM is built-in (not a loadable module);
# we rely on the /dev/kvm stat below as the real check.
- name: Ensure KVM module is loaded ({{ firecracker_kvm_module }})
  community.general.modprobe:
    name: "{{ firecracker_kvm_module }}"
    state: present
  failed_when: false

- name: Verify /dev/kvm exists
  ansible.builtin.stat:
    path: /dev/kvm
  register: firecracker_dev_kvm

- name: Fail if KVM is not available
  ansible.builtin.fail:
    msg: >-
      /dev/kvm does not exist. Detected CPU vendor → {{ firecracker_kvm_module }}.
      Ensure KVM is enabled in BIOS and the correct module is loadable.
  when: not firecracker_dev_kvm.stat.exists

# --- ZFS ARC tuning ---

- name: Set ZFS ARC max to prevent VM OOM
  ansible.builtin.copy:
    content: "options zfs zfs_arc_max={{ firecracker_zfs_arc_max_bytes }}\n"
    dest: /etc/modprobe.d/zfs-arc.conf
    mode: "0644"
  notify: rebuild initramfs

# --- Jailer user and directories ---

- name: Create firecracker group
  ansible.builtin.group:
    name: "{{ firecracker_jailer_user }}"
    gid: "{{ firecracker_jailer_gid }}"
    state: present

- name: Create vm-orchestrator client group
  ansible.builtin.group:
    name: "{{ firecracker_vm_orchestrator_socket_group }}"
    system: true
    state: present

- name: Create firecracker user
  ansible.builtin.user:
    name: "{{ firecracker_jailer_user }}"
    uid: "{{ firecracker_jailer_uid }}"
    group: "{{ firecracker_jailer_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Create jailer root directory
  ansible.builtin.file:
    path: "{{ firecracker_jailer_root }}"
    state: directory
    mode: "0755"

- name: Create guest image directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/lib/verself
    - "{{ firecracker_guest_images_dir }}"
    - "{{ firecracker_guest_images_dir }}/toolchains"
    - "{{ firecracker_state_db_path | dirname }}"

- name: Ensure vm-orchestrator state directory ownership
  ansible.builtin.file:
    path: "{{ firecracker_state_db_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# --- Host networking (native nftables) ---

- name: Gather network facts for implicit Firecracker uplink
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - network
  when: firecracker_host_uplink_interface | default('', true) | length == 0

- name: Require default IPv4 interface for implicit Firecracker uplink
  ansible.builtin.assert:
    that:
      - ansible_facts.default_ipv4 is defined
      - ansible_facts.default_ipv4.interface is defined
      - ansible_facts.default_ipv4.interface | length > 0
    fail_msg: >-
      Set firecracker_host_uplink_interface explicitly or ensure the host has a default IPv4 route.
  when: firecracker_host_uplink_interface | default('', true) | length == 0

- name: Resolve uplink interface for Firecracker NAT
  ansible.builtin.set_fact:
    firecracker_resolved_uplink: >-
      {{ firecracker_host_uplink_interface
         if (firecracker_host_uplink_interface | default('', true) | length > 0)
         else ansible_facts.default_ipv4.interface }}

- name: Persist IP forwarding via sysctl
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-verself.conf
    reload: true

  # Keep placeholder substitution controller-side; copy-then-replace rewrites
  # the host file on every run and triggers needless network restarts.
- name: Stage rendered Firecracker nftables ruleset
  ansible.builtin.copy:
    content: >-
      {{
        lookup(
          'ansible.builtin.file',
          verself_repo_root + '/src/substrate/vm-orchestrator/host/nftables/firecracker.nft',
          rstrip=False
        )
        | replace('__VERSELF_UPLINK__', firecracker_resolved_uplink)
      }}
    dest: /etc/nftables.d/firecracker.nft
    mode: "0644"
  notify: restart firecracker networking

- name: Install Firecracker host networking setup script
  ansible.builtin.template:
    src: firecracker-network-setup.sh.j2
    dest: /usr/local/bin/verself-firecracker-network-setup
    mode: "0755"
  notify: restart firecracker networking

- name: Install Firecracker host networking service
  ansible.builtin.template:
    src: verself-firecracker-network.service.j2
    dest: /etc/systemd/system/verself-firecracker-network.service
    mode: "0644"
  notify: restart firecracker networking

- name: Ensure Firecracker host networking service is enabled and started
  ansible.builtin.systemd:
    name: verself-firecracker-network.service
    enabled: true
    state: started
    daemon_reload: true

# --- Guest image verification ---
# Substrate built on the host by guest_rootfs role; toolchain images
# Bazel-built and staged by guest_rootfs role.

- name: Verify guest kernel exists
  ansible.builtin.stat:
    path: "{{ firecracker_kernel_path }}"
    # get_checksum defaults to true, which would sha1 the file. We only need existence + mtime.
    get_checksum: false
  register: firecracker_guest_kernel

- name: Verify substrate ext4 exists
  ansible.builtin.stat:
    path: "{{ firecracker_substrate_path }}"
    # Avoid the default sha1 checksum — substrate is multi-hundred-MB and
    # the seed RPC's vs:source_digest already tracks content drift.
    get_checksum: false
  register: firecracker_substrate

- name: Verify substrate manifest exists
  ansible.builtin.stat:
    path: "{{ firecracker_substrate_manifest_path }}"
    get_checksum: false
  register: firecracker_substrate_manifest

- name: Verify toolchain image artifacts exist
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  register: firecracker_toolchain_image_stats
  loop: "{{ firecracker_toolchain_image_paths }}"

- name: Fail if guest image artifacts are missing
  ansible.builtin.fail:
    msg: >
      Guest images not found at {{ firecracker_kernel_path }},
      {{ firecracker_substrate_path }}, {{ firecracker_substrate_manifest_path }},
      and/or one or more toolchain image paths.
      The guest_rootfs role in the canonical site playbook must stage them
      before the firecracker role runs.
  when: >-
    not firecracker_guest_kernel.stat.exists
    or not firecracker_substrate.stat.exists
    or not firecracker_substrate_manifest.stat.exists
    or (firecracker_toolchain_image_stats.results | rejectattr('stat.exists') | list | length > 0)

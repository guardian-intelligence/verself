---
argument_specs:
  main:
    short_description: "Firecracker host setup: KVM, jailer, networking, guest image staging"
    description:
      - "Installs Firecracker + jailer from topology catalog vars, configures KVM,"
      - "creates the jailer user/group, configures Firecracker guest networking,"
      - "and verifies that guest image artifacts have been staged. The runtime"
      - "daemon and image seeding are deployed by the vm-orchestrator Nomad unit."
    options:
      firecracker_zfs_pool:
        type: str
        default: vspool
        description: "ZFS pool checked by the Firecracker preflight."

      firecracker_jailer_root:
        type: path
        default: /srv/jailer
        description: "Root directory for Firecracker jailer chroots."

      firecracker_jailer_uid:
        type: int
        default: 10000
        description: "UID for the jailer system user. Must be a positive integer."

      firecracker_jailer_gid:
        type: int
        default: 10000
        description: "GID for the jailer system group. Must be a positive integer."

      firecracker_jailer_user:
        type: str
        default: firecracker
        description: "System username for the jailer process."

      firecracker_guest_images_dir:
        type: path
        default: /var/lib/verself/guest-images
        description: "Host directory for staged guest-image artefacts (substrate.ext4, vmlinux, toolchain ext4s)."

      firecracker_kernel_path:
        type: path
        default: /var/lib/verself/guest-images/vmlinux
        description: "Path to the guest kernel. Pre-staged by guest_rootfs role."

      firecracker_substrate_path:
        type: path
        default: /var/lib/verself/guest-images/substrate.ext4
        description: "Path to the substrate ext4 (boot disk source). Built on the host by guest_rootfs role."

      firecracker_substrate_manifest_path:
        type: path
        default: /var/lib/verself/guest-images/manifest.json
        description: "Path to the substrate build manifest JSON (sha256, size, package_count)."

      firecracker_toolchain_image_paths:
        type: list
        elements: path
        description: "Toolchain ext4 images that must be staged before vm-orchestrator seeding."

      firecracker_zfs_arc_max_bytes:
        type: int
        default: 8589934592
        description: "ZFS ARC max size in bytes (default 8 GiB). Prevents VM OOM."

      firecracker_state_db_path:
        type: path
        default: /var/lib/verself/vm-orchestrator/state.db
        description: "SQLite WAL ledger path for vm-orchestrator host runs and network slots."

      firecracker_host_uplink_interface:
        type: str
        default: ""
        description: "Host network interface for guest NAT. Auto-detected if empty."

      firecracker_host_service_interface:
        type: str
        default: verself-host0
        description: "Dummy host-only interface exposing selected platform services to Firecracker guests."

      firecracker_host_service_ip:
        type: str
        default: "10.255.0.1"
        description: "Host-only IPv4 address exposed on firecracker_host_service_interface."

      firecracker_vm_orchestrator_socket_group:
        type: str
        default: vm-clients
        description: "System group granted rw access to the vm-orchestrator Unix socket."

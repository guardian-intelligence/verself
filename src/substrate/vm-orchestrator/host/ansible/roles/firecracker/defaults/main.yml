---
# Firecracker host setup defaults. The daemon and composable image seeding are
# owned by the component-local vm-orchestrator Nomad job.
firecracker_zfs_pool: vspool
firecracker_monorepo_root: "{{ playbook_dir }}/../../../.."
firecracker_bazelisk: bazelisk
firecracker_release_bazel_label: "@guest_image_firecracker_release//file"
firecracker_release_remote_tmp: /tmp
firecracker_jailer_root: /srv/jailer
firecracker_jailer_uid: 10000
firecracker_jailer_gid: 10000
firecracker_jailer_user: firecracker
firecracker_guest_images_dir: /var/lib/verself/guest-images
firecracker_kernel_path: "{{ firecracker_guest_images_dir }}/vmlinux"
firecracker_substrate_path: "{{ firecracker_guest_images_dir }}/substrate.ext4"
firecracker_substrate_manifest_path: "{{ firecracker_guest_images_dir }}/manifest.json"
firecracker_toolchain_image_paths:
  - "{{ firecracker_guest_images_dir }}/toolchains/gh-actions-runner.ext4"
  - "{{ firecracker_guest_images_dir }}/toolchains/forgejo-runner.ext4"
firecracker_zfs_arc_max_bytes: 8589934592  # 8 GiB
firecracker_state_db_path: /var/lib/verself/vm-orchestrator/state.db
firecracker_host_uplink_interface: ""
firecracker_host_service_interface: verself-host0
firecracker_host_service_ip: 10.255.0.1
firecracker_vm_orchestrator_socket_group: vm-clients

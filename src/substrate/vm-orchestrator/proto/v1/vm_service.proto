syntax = "proto3";

package verself.vm_orchestrator.v1;

option go_package = "github.com/verself/vm-orchestrator/proto/v1;vmrpc";

service VMService {
  rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);
  rpc GetLease(GetLeaseRequest) returns (GetLeaseResponse);
  rpc ListLeases(ListLeasesRequest) returns (ListLeasesResponse);
  rpc StreamLeaseEvents(StreamLeaseEventsRequest) returns (stream LeaseEvent);

  rpc StartExec(StartExecRequest) returns (StartExecResponse);
  rpc CancelExec(CancelExecRequest) returns (CancelExecResponse);
  rpc GetExec(GetExecRequest) returns (GetExecResponse);
  rpc WaitExec(WaitExecRequest) returns (WaitExecResponse);

  rpc CommitFilesystemMount(CommitFilesystemMountRequest) returns (CommitFilesystemMountResponse);
  rpc PruneFilesystemGeneration(PruneFilesystemGenerationRequest) returns (PruneFilesystemGenerationResponse);
  rpc GetCapacity(GetCapacityRequest) returns (GetCapacityResponse);

  // SeedImage is the privileged image-seeding entry point used by deploy-time
  // tooling (vm-orchestrator-cli seed-image). It materializes a composable
  // image at pool/images/<ref>@ready from a host-local artifact (dd_from_file)
  // or fresh filesystem (mkfs_ext4). Authorization is by SO_PEERCRED uid=0:
  // only callers running as root on the host may invoke it.
  rpc SeedImage(SeedImageRequest) returns (SeedImageResponse);
}

enum LeaseState {
  LEASE_STATE_UNSPECIFIED = 0;
  LEASE_STATE_ACQUIRING = 1;
  LEASE_STATE_READY = 2;
  LEASE_STATE_DRAINING = 3;
  LEASE_STATE_RELEASED = 4;
  LEASE_STATE_EXPIRED = 5;
  LEASE_STATE_CRASHED = 6;
}

enum ExecState {
  EXEC_STATE_UNSPECIFIED = 0;
  EXEC_STATE_PENDING = 1;
  EXEC_STATE_RUNNING = 2;
  EXEC_STATE_EXITED = 3;
  EXEC_STATE_FAILED = 4;
  EXEC_STATE_CANCELED = 5;
  EXEC_STATE_KILLED_BY_LEASE_EXPIRY = 6;
}

enum StdioMode {
  STDIO_MODE_UNSPECIFIED = 0;
  STDIO_MODE_NONE = 1;
  STDIO_MODE_BUFFERED = 2;
  STDIO_MODE_STREAMED = 3;
}

enum NetworkAttachMode {
  NETWORK_ATTACH_MODE_UNSPECIFIED = 0;
  NETWORK_ATTACH_MODE_NAT = 1;
  NETWORK_ATTACH_MODE_NONE = 2;
}

enum LeaseEventType {
  LEASE_EVENT_TYPE_UNSPECIFIED = 0;
  LEASE_EVENT_TYPE_LEASE_ACQUIRED = 1;
  LEASE_EVENT_TYPE_VM_BOOTING = 2;
  LEASE_EVENT_TYPE_VM_READY = 3;
  LEASE_EVENT_TYPE_LEASE_RENEWED = 4;
  LEASE_EVENT_TYPE_EXEC_STARTED = 5;
  LEASE_EVENT_TYPE_EXEC_FINISHED = 6;
  LEASE_EVENT_TYPE_EXEC_CANCELED = 7;
  LEASE_EVENT_TYPE_FILESYSTEM_COMMIT_STARTED = 8;
  LEASE_EVENT_TYPE_FILESYSTEM_COMMITTED = 9;
  LEASE_EVENT_TYPE_FILESYSTEM_COMMIT_FAILED = 10;
  LEASE_EVENT_TYPE_VM_SHUTDOWN = 11;
  LEASE_EVENT_TYPE_LEASE_EXPIRED = 12;
  LEASE_EVENT_TYPE_LEASE_RELEASED = 13;
  LEASE_EVENT_TYPE_LEASE_CRASHED = 14;
  LEASE_EVENT_TYPE_TELEMETRY_DIAGNOSTIC = 15;
}

message NetworkAttach {
  NetworkAttachMode mode = 1;
}

// VMResources is the customer-requested VM shape validated by vm-orchestrator.
message VMResources {
  uint32 vcpus = 1;
  uint32 memory_mib = 2;
  uint32 root_disk_gib = 3;
  string kernel_image = 4;
}

message LeaseSpec {
  VMResources resources = 1;
  reserved 4, 7, 10;
  uint64 ttl_seconds = 5;
  string trust_class = 6;
  NetworkAttach network = 8;
  repeated FilesystemMount filesystem_mounts = 9;
}

message FilesystemMount {
  string name = 1;
  string source_ref = 2;
  string mount_path = 3;
  string fs_type = 4;
  bool read_only = 5;
  string operation_id = 6;
  repeated string bind_paths = 7;
  bool required = 8;
  uint64 size_bytes = 9;
}

message FilesystemMountResult {
  string name = 1;
  string mount_path = 2;
  bool mounted = 3;
  string error = 4;
  string operation_id = 5;
  bool required = 6;
}

message AcquireLeaseRequest {
  string idempotency_key = 1;
  LeaseSpec spec = 2;
}

message AcquireLeaseResponse {
  string lease_id = 1;
  LeaseState state = 2;
  uint64 acquired_at_unix_ns = 3;
  uint64 expires_at_unix_ns = 4;
  string vm_ip = 5;
  VMResources resources = 6;
  repeated FilesystemMountResult filesystem_mounts = 7;
}

message RenewLeaseRequest {
  string lease_id = 1;
  string idempotency_key = 2;
  uint64 extend_seconds = 3;
  reserved 4;
}

message RenewLeaseResponse {
  string lease_id = 1;
  uint64 expires_at_unix_ns = 2;
}

message ReleaseLeaseRequest {
  string lease_id = 1;
  string idempotency_key = 2;
  reserved 3;
}

message ReleaseLeaseResponse {
  string lease_id = 1;
  LeaseState state = 2;
  uint64 released_at_unix_ns = 3;
}

message GetLeaseRequest {
  string lease_id = 1;
}

message LeaseRecord {
  string lease_id = 1;
  LeaseState state = 2;
  uint64 acquired_at_unix_ns = 3;
  uint64 ready_at_unix_ns = 4;
  uint64 expires_at_unix_ns = 5;
  uint64 terminal_at_unix_ns = 6;
  string terminal_reason = 7;
  string vm_ip = 8;
  VMResources resources = 9;
  string trust_class = 10;
  repeated FilesystemMountResult filesystem_mounts = 11;
}

message GetLeaseResponse {
  LeaseRecord lease = 1;
}

message ListLeasesRequest {
  bool include_terminal = 1;
  uint32 limit = 2;
}

message ListLeasesResponse {
  repeated LeaseRecord leases = 1;
}

message StreamLeaseEventsRequest {
  string lease_id = 1;
  uint64 from_seq = 2;
  bool follow = 3;
  uint32 batch_size = 4;
}

message LeaseEvent {
  string lease_id = 1;
  uint64 event_seq = 2;
  LeaseEventType event_type = 3;
  string exec_id = 4;
  map<string, string> attrs = 5;
  uint64 created_at_unix_ns = 6;
}

message ExecSpec {
  repeated string argv = 1;
  string working_dir = 2;
  map<string, string> env = 3;
  StdioMode stdin = 4;
  StdioMode stdout = 5;
  StdioMode stderr = 6;
  uint64 max_wall_seconds = 7;
}

message StartExecRequest {
  string lease_id = 1;
  string idempotency_key = 2;
  ExecSpec spec = 3;
}

message StartExecResponse {
  string lease_id = 1;
  string exec_id = 2;
  ExecState state = 3;
  uint64 started_at_unix_ns = 4;
}

message CancelExecRequest {
  string lease_id = 1;
  string exec_id = 2;
  string idempotency_key = 3;
  string reason = 4;
}

message CancelExecResponse {
  string lease_id = 1;
  string exec_id = 2;
  ExecState state = 3;
  bool accepted = 4;
}

message GetExecRequest {
  string lease_id = 1;
  string exec_id = 2;
  bool include_output = 3;
}

message WaitExecRequest {
  string lease_id = 1;
  string exec_id = 2;
  bool include_output = 3;
}

message ExecRecord {
  string lease_id = 1;
  string exec_id = 2;
  ExecState state = 3;
  int32 exit_code = 4;
  string terminal_reason = 5;
  uint64 queued_at_unix_ns = 6;
  uint64 started_at_unix_ns = 7;
  uint64 first_byte_at_unix_ns = 8;
  uint64 exited_at_unix_ns = 9;
  uint64 stdout_bytes = 10;
  uint64 stderr_bytes = 11;
  uint64 dropped_log_bytes = 12;
  string output = 13;
  VMMetrics metrics = 14;
  uint64 zfs_written = 15;
  uint64 rootfs_provisioned_bytes = 16;
}

message GetExecResponse {
  ExecRecord exec = 1;
}

message WaitExecResponse {
  ExecRecord exec = 1;
}

// CommitFilesystemMount snapshots the named writable mount and persists it
// as a new immutable generation under the configured golden dataset.
//
// new_generation_name is the snapshot short name (without '@' or '/') the
// orchestrator will create on the volume dataset. The caller (sandbox-
// rental) supplies it so product state and host state share one canonical
// generation identity.
message CommitFilesystemMountRequest {
  string lease_id = 1;
  string mount_name = 2;
  string volume_id = 3;
  string parent_snapshot_ref = 4;
  string new_generation_name = 5;
  string idempotency_key = 6;
  string operation_id = 7;
}

message CommitFilesystemMountResponse {
  string lease_id = 1;
  string mount_name = 2;
  string volume_dataset = 3;
  string snapshot = 4;
  uint64 used_bytes = 5;
  uint64 written_bytes = 6;
  uint64 committed_at_unix_ns = 7;
}

message PruneFilesystemGenerationRequest {
  string idempotency_key = 1;
  string operation_id = 2;
  string durable_generation_id = 3;
  string volume_id = 4;
  string snapshot_ref = 5;
}

message PruneFilesystemGenerationResponse {
  string operation_id = 1;
  string durable_generation_id = 2;
  string volume_id = 3;
  string snapshot_ref = 4;
  uint64 pruned_at_unix_ns = 5;
}

message VMMetrics {
  uint64 boot_time_us = 1;
  uint64 block_read_bytes = 2;
  uint64 block_write_bytes = 3;
  uint64 block_read_count = 4;
  uint64 block_write_count = 5;
  uint64 net_rx_bytes = 6;
  uint64 net_tx_bytes = 7;
  uint64 vcpu_exit_count = 8;
}

// VMPoolCapacity is the per-host capacity advertised by vm-orchestrator.
// It replaces the old RuntimeProfileCapacity: there is one pool per host,
// and customer shapes come from VMResources at AcquireLease time — not
// from a fixed list of named profiles.
message VMPoolCapacity {
  uint32 total_slots = 1;
  uint32 leases_held = 2;
  uint32 leases_available = 3;
  uint32 max_vcpus_per_lease = 4;
  uint32 max_memory_mib_per_lease = 5;
  uint32 max_root_disk_gib_per_lease = 6;
  uint64 rootfs_provisioned_bytes = 7;
}

message GetCapacityRequest {}

message GetCapacityResponse {
  string guest_pool_cidr = 1;
  VMPoolCapacity pool = 2;
}

enum SeedStrategy {
  SEED_STRATEGY_UNSPECIFIED = 0;
  SEED_STRATEGY_DD_FROM_FILE = 1;
  SEED_STRATEGY_MKFS_EXT4 = 2;
}

enum SeedOutcome {
  SEED_OUTCOME_UNSPECIFIED = 0;
  SEED_OUTCOME_REFRESHED = 1;
  SEED_OUTCOME_UP_TO_DATE = 2;
}

message SeedImageRequest {
  // image_ref is the composable image identifier (e.g. "substrate",
  // "gh-actions-runner"). Same alphabet as other service-authorized refs.
  string image_ref = 1;

  SeedStrategy strategy = 2;

  // size_bytes is the zvol size in bytes. Required.
  uint64 size_bytes = 3;

  // volblocksize is the ZFS volblocksize property (e.g. "16K"). Empty
  // selects the daemon default.
  string volblocksize = 4;

  // source_path is the host-local artifact whose bytes get dd-ed onto the
  // staging zvol. Required when strategy=SEED_STRATEGY_DD_FROM_FILE.
  string source_path = 5;

  // filesystem_label is passed to mkfs -L. Required when
  // strategy=SEED_STRATEGY_MKFS_EXT4.
  string filesystem_label = 6;

  // allow_destroying_active_clones authorizes the seed flow to recursively
  // destroy any workload clones derived from the previous image dataset
  // before the rename promotion. Set true at deploy time when leases from
  // before the deploy are guaranteed crashed.
  bool allow_destroying_active_clones = 7;
}

message SeedImageResponse {
  string image_ref = 1;
  SeedOutcome outcome = 2;
  string dataset = 3;
  string snapshot = 4;
  string source_digest = 5;
  uint64 seeded_bytes = 6;
  uint32 dependents_torn = 7;
  uint64 seeded_at_unix_ns = 8;
}

# Node placement coordinates (see prod/vars.yml for the model). cpu_isa_level is
# derived per-host from CPU flags by the nomad role; datacenter iad1 (single ASH
# metro). dev is not a load generator. Each site is its own SPIFFE trust domain —
# the cell boundary.
nomad_node_datacenter: iad1
nomad_node_pool: default
nomad_node_meta: {}
spire_agent_id: spiffe://dev.verself.sh/node/single-node
spire_agent_socket_path: /run/spire-agent/sockets/agent.sock
spire_bundle_endpoint_bind_address: 127.0.0.1
spire_bundle_endpoint_bind_port: 8082
spire_jwt_bundle_endpoint_url: https://127.0.0.1:8082
spire_jwt_issuer_url: https://127.0.0.1:8082
spire_server_bind_address: 127.0.0.1
spire_server_bind_port: 8081
spire_server_socket_path: /run/spire-server/private/api.sock
spire_trust_domain: dev.verself.sh
spire_workload_group: spire_workload
host_wireguard_tunnels: {}
dogfood_org_id: org_dev_01JZ0000000000000000000000
service_discovery_canary_org_slug: guardian-intelligence
stalwart_operator_forward_to: ""
github_integration_service_github_app_id: 0
github_integration_service_github_app_slug: verself-runner-dev
github_integration_service_github_app_client_id: ""
github_integration_service_github_app_settings_url: "https://github.com/organizations/guardian-intelligence/settings/apps/verself-runner-dev"
github_integration_service_github_runner_class_prefix: verself-dev-

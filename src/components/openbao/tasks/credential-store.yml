---
- name: Read OpenBao root token for credential-store convergence
  ansible.builtin.slurp:
    src: "{{ openbao_credstore_dir }}/root-token"
  register: openbao_credential_root_token_raw
  no_log: true

- name: Normalize OpenBao credential-store org IDs
  ansible.builtin.set_fact:
    openbao_credential_org_ids_normalized: >-
      {{
        openbao_credential_org_ids
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Assert OpenBao credential-store inputs
  ansible.builtin.assert:
    that:
      - openbao_credential_org_ids_normalized | length > 0
      - openbao_credential_kv_mount_prefix | length > 0
      - openbao_credential_transit_mount_prefix | length > 0
      - openbao_credential_consumer_subject | length > 0
    fail_msg: "OpenBao credential-store convergence requires org IDs, mount prefixes, and the secrets-service SPIFFE subject."

- name: List OpenBao secret mounts for credential stores
  ansible.builtin.uri:
    url: "https://{{ openbao_api_address }}/v1/sys/mounts"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_credential_root_token_raw.content | b64decode | trim }}"
    ca_path: "{{ openbao_tls_dir }}/cert.pem"
    status_code: 200
    return_content: true
  register: openbao_credential_mounts_response
  changed_when: false
  no_log: true

- name: Mount OpenBao credential KV stores
  ansible.builtin.uri:
    url: "https://{{ openbao_api_address }}/v1/sys/mounts/{{ openbao_credential_kv_mount_prefix }}-{{ item }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_credential_root_token_raw.content | b64decode | trim }}"
    body_format: json
    body:
      type: kv
      options:
        version: "2"
      description: "Verself opaque credentials for org {{ item }}"
    ca_path: "{{ openbao_tls_dir }}/cert.pem"
    status_code: 204
  loop: "{{ openbao_credential_org_ids_normalized }}"
  when: ((openbao_credential_kv_mount_prefix ~ '-' ~ item ~ '/') not in (openbao_credential_mounts_response.json.data.keys() | list))
  changed_when: true
  no_log: true

- name: Mount OpenBao credential transit stores
  ansible.builtin.uri:
    url: "https://{{ openbao_api_address }}/v1/sys/mounts/{{ openbao_credential_transit_mount_prefix }}-{{ item }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_credential_root_token_raw.content | b64decode | trim }}"
    body_format: json
    body:
      type: transit
      description: "Verself opaque credential HMAC for org {{ item }}"
    ca_path: "{{ openbao_tls_dir }}/cert.pem"
    status_code: 204
  loop: "{{ openbao_credential_org_ids_normalized }}"
  when: ((openbao_credential_transit_mount_prefix ~ '-' ~ item ~ '/') not in (openbao_credential_mounts_response.json.data.keys() | list))
  changed_when: true
  no_log: true

- name: Initialize OpenBao credential-store desired state
  ansible.builtin.set_fact:
    openbao_credential_policy_items: []
    openbao_credential_role_items: []

- name: Build OpenBao credential-store desired state
  ansible.builtin.set_fact:
    openbao_credential_policy_items: "{{ (openbao_credential_policy_items | default([])) + [
      {
        'org_id': item,
        'name': 'secrets-credential-manage-' ~ item,
        'policy': 'path \"' ~ openbao_credential_kv_mount_prefix ~ '-' ~ item ~ '/data/opaque_credential/org/*\" { capabilities = [\"create\", \"update\", \"read\", \"delete\"] }\n'
          ~ 'path \"' ~ openbao_credential_kv_mount_prefix ~ '-' ~ item ~ '/metadata/opaque_credential/org/*\" { capabilities = [\"read\", \"list\", \"delete\"] }\n'
          ~ 'path \"' ~ openbao_credential_transit_mount_prefix ~ '-' ~ item ~ '/keys/verself-opaque-credential-hmac\" { capabilities = [\"create\", \"update\", \"read\"] }\n'
          ~ 'path \"' ~ openbao_credential_transit_mount_prefix ~ '-' ~ item ~ '/hmac/verself-opaque-credential-hmac/sha2-256\" { capabilities = [\"update\"] }'
      },
      {
        'org_id': item,
        'name': 'secrets-credential-verify-' ~ item,
        'policy': 'path \"' ~ openbao_credential_kv_mount_prefix ~ '-' ~ item ~ '/data/opaque_credential/org/*\" { capabilities = [\"read\", \"update\"] }\n'
          ~ 'path \"' ~ openbao_credential_kv_mount_prefix ~ '-' ~ item ~ '/metadata/opaque_credential/org/*\" { capabilities = [\"read\", \"list\"] }\n'
          ~ 'path \"' ~ openbao_credential_transit_mount_prefix ~ '-' ~ item ~ '/verify/verself-opaque-credential-hmac/sha2-256\" { capabilities = [\"update\"] }'
      }
    ] }}"
  loop: "{{ openbao_credential_org_ids_normalized }}"

- name: Read OpenBao credential-store policies
  ansible.builtin.uri:
    url: "https://{{ openbao_api_address }}/v1/sys/policies/acl/{{ item.name }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_credential_root_token_raw.content | b64decode | trim }}"
    ca_path: "{{ openbao_tls_dir }}/cert.pem"
    status_code: [200, 404]
    return_content: true
  loop: "{{ openbao_credential_policy_items }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_credential_policy_reads
  changed_when: false
  no_log: true

- name: Write OpenBao credential-store policies
  ansible.builtin.uri:
    url: "https://{{ openbao_api_address }}/v1/sys/policies/acl/{{ item.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_credential_root_token_raw.content | b64decode | trim }}"
    body_format: json
    body:
      policy: "{{ item.policy }}"
    ca_path: "{{ openbao_tls_dir }}/cert.pem"
    status_code: [200, 204]
  loop: "{{ openbao_credential_policy_items }}"
  loop_control:
    index_var: openbao_credential_policy_index
    label: "{{ item.name }}"
  when: >-
    openbao_credential_policy_reads.results[openbao_credential_policy_index].status == 404
    or (
      openbao_credential_policy_reads.results[openbao_credential_policy_index].json.data.policy
      | default('')
      | trim
    ) != (item.policy | trim)
  changed_when: true
  no_log: true

- name: Build OpenBao credential-store roles
  ansible.builtin.set_fact:
    openbao_credential_role_items: "{{ (openbao_credential_role_items | default([])) + [
      {
        'name': 'secrets-credential-manage-' ~ item,
        'token_policies': ['secrets-credential-manage-' ~ item]
      },
      {
        'name': 'secrets-credential-verify-' ~ item,
        'token_policies': ['secrets-credential-verify-' ~ item]
      }
    ] }}"
  loop: "{{ openbao_credential_org_ids_normalized }}"

- name: Read OpenBao credential-store roles
  ansible.builtin.uri:
    url: "https://{{ openbao_api_address }}/v1/auth/{{ openbao_spiffe_jwt_mount }}/role/{{ item.name }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_credential_root_token_raw.content | b64decode | trim }}"
    ca_path: "{{ openbao_tls_dir }}/cert.pem"
    status_code: [200, 404]
    return_content: true
  loop: "{{ openbao_credential_role_items }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_credential_role_reads
  changed_when: false
  no_log: true

- name: Configure OpenBao credential-store roles
  ansible.builtin.uri:
    url: "https://{{ openbao_api_address }}/v1/auth/{{ openbao_spiffe_jwt_mount }}/role/{{ item.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_credential_root_token_raw.content | b64decode | trim }}"
    body_format: json
    body:
      role_type: jwt
      bound_audiences:
        - "{{ openbao_workload_audience }}"
      bound_subject: "{{ openbao_credential_consumer_subject }}"
      user_claim: sub
      token_policies: "{{ item.token_policies }}"
      token_ttl: "{{ openbao_workload_token_ttl }}"
      token_max_ttl: "{{ openbao_workload_token_max_ttl }}"
    ca_path: "{{ openbao_tls_dir }}/cert.pem"
    status_code: 204
  loop: "{{ openbao_credential_role_items }}"
  loop_control:
    index_var: openbao_credential_role_index
    label: "{{ item.name }}"
  changed_when: >-
    openbao_credential_role_reads.results[openbao_credential_role_index].status == 404
    or (
      openbao_credential_role_reads.results[openbao_credential_role_index].json.data.bound_subject
      | default('')
    ) != openbao_credential_consumer_subject
    or (
      openbao_credential_role_reads.results[openbao_credential_role_index].json.data.bound_audiences
      | default([])
      | sort
    ) != ([openbao_workload_audience] | sort)
    or (
      openbao_credential_role_reads.results[openbao_credential_role_index].json.data.token_policies
      | default([])
      | sort
    ) != (item.token_policies | sort)
  no_log: true

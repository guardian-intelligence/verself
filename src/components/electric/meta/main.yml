---
# Invoked once per Electric instance from the same play;
# Ansible's default is to skip repeat invocations of a role in the roles:
# block unless this flag is set.
allow_duplicates: true
dependencies: []

galaxy_info:
  author: verself
  description: >-
    Prepare one ElectricSQL sync instance for Nomad — create the pg role,
    reconcile publication + REPLICA IDENTITY + ownership in a single psql
    DO block (the module-based approach silently corrupts ANY()
    comparisons), render the runtime env file, and admit the pinned image
    into the local containerd store.
  role_name: electric
  license: UNLICENSED
  min_ansible_version: "2.18"
  platforms:
    - name: Ubuntu
      versions:
        - noble
  galaxy_tags:
    - electric
    - postgresql

---
argument_specs:
  main:
    short_description: Prepare host state for one ElectricSQL sync instance.
    description:
      - >-
        Invoked once per Electric instance before the Nomad job runs.
        Instance-specific paths, role names, and table lists come from
        electric_config; the role owns credential materialization, persistent
        storage, local image admission, and the pg reconcile DO block.
    options:
      electric_config:
        type: dict
        required: true
        options:
          electric_instance:
            type: str
            required: true
            choices: [default, mail, notifications]
          electric_service_name:
            type: str
            required: true
          electric_pg_role:
            type: str
            required: true
          electric_pg_conn_limit:
            type: int
            required: true
          electric_db:
            type: str
            required: true
          electric_writer_role:
            type: str
            required: true
          electric_publication_name:
            type: str
            required: true
          electric_publication_tables:
            type: list
            elements: str
            required: true
          electric_storage_dir:
            type: str
            required: true
          electric_credstore_dir:
            type: str
            required: true

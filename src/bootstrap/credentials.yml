# Non-secret bootstrap credential inventory.
#
# This file is a contract for what bootstrap needs and where an operator should
# retrieve it. It must never contain live, encrypted, redacted, or example secret
# values. Runtime secret target names are OpenBao KV logical names, not paths.
version: verself.bootstrap.credentials.v1

value_policy:
  committed_secret_values: forbidden
  committed_encrypted_secret_values: forbidden
  operator_handoff: local_0600_files_or_interactive_secret_manager_read

bootstrap_input_file:
  local_handoff: --bootstrap-credentials-file
  constraints:
    - regular_file
    - not_symlink
    - mode_0600_or_stricter
  fields:
    site: target site name; must match --site
    cloudflare: provider authority used to mint and verify R2 child credentials
    openbao_runtime_secrets: OpenBao runtime secret logical name to provider value

root_operator:
  # Single operator-held OpenBao root-of-site key. The CLI receives a file path
  # and stages it under /run only long enough to initialize or unseal OpenBao.
  - key: openbao_site_root_token
    kind: bootstrap_root_key
    source: operator_password_manager
    local_handoff: --openbao-site-root-token-file
    target: openbao_unseal_wrapper

prod_global:
  # One Cloudflare account token is enough for bootstrap. Steady-state rotation
  # should create overlapping generations after the first site is alive.
  - key: cloudflare_api_key
    provider: cloudflare
    kind: account_api_token
    source: cloudflare_dashboard_or_prod_openbao
    permissions:
      - account_api_tokens_read
      - account_api_tokens_write
      - workers_r2_storage_read
      - workers_r2_storage_write
      - workers_r2_storage_bucket_item_read
      - workers_r2_storage_bucket_item_write
      - zone_read
      - dns_write
      - email_routing
    used_for:
      - dns_reconciliation
      - acme_dns_01
      - cloudflare_email_routing
      - r2_bucket_reconciliation
      - r2_child_credential_rotation
    target: cloudflare_integration_service_authority

  # Only required when bootstrap also provisions or reinstalls the bare-metal
  # host. If Latitude already handed us a host, this is not needed for deploy.
  - key: latitude_api_key
    provider: latitude
    kind: project_api_token
    source: latitude_dashboard_or_prod_openbao
    used_for:
      - bare_metal_provisioning
      - host_reinstall
    target: provisioning_controller

  # Prod/global Resend authority is copied into a site only long enough for
  # email-service to create and rotate site-local sending keys.
  - key: resend_full_access_api_key
    provider: resend
    kind: full_access_api_key
    source: resend_dashboard_or_prod_openbao
    used_for:
      - resend_child_sending_key_provisioning
      - resend_child_sending_key_rotation
    target_openbao_name: email-service.resend.full_access_api_key

site_specific:
  - key: stripe_secret_key
    provider: stripe
    kind: secret_api_key
    source: stripe_dashboard_or_prod_openbao
    target_openbao_name: billing-service.stripe.secret_key

  - key: stripe_webhook_signing_secret
    provider: stripe
    kind: webhook_signing_secret
    source: stripe_webhook_endpoint_or_prod_openbao
    target_openbao_name: billing-service.stripe.webhook_secret

  - key: github_app_private_key
    provider: github
    kind: app_private_key_pem
    source: github_app_settings_or_prod_openbao
    target_openbao_name: github-integration-service.github.private_key

  - key: github_app_webhook_secret
    provider: github
    kind: webhook_secret
    source: github_app_settings_or_prod_openbao
    target_openbao_name: github-integration-service.github.webhook_secret

  - key: github_app_oauth_client_secret
    provider: github
    kind: oauth_client_secret
    source: github_app_settings_or_prod_openbao
    target_openbao_name: github-integration-service.github.oauth_client_secret

  # Separate from the runner GitHub App unless the auth design explicitly
  # consolidates the two provider applications.
  - key: github_login_oauth_client_secret
    provider: github
    kind: oauth_client_secret
    source: github_oauth_app_settings_or_prod_openbao
    target_openbao_name: auth-control-plane.github_login.oauth_client_secret

provider_derived:
  # These are generated from cloudflare_api_key during bootstrap. Operators
  # should not hand-copy these unless recovering from a provider outage.
  - key: object_storage_r2_admin_access_key_id
    provider: cloudflare
    source: generated_by_cloudflare_integration_service
    target_openbao_name: object-storage-service.r2.admin_access_key_id

  - key: object_storage_r2_admin_secret_access_key
    provider: cloudflare
    source: generated_by_cloudflare_integration_service
    target_openbao_name: object-storage-service.r2.admin_secret_access_key

  - key: object_storage_r2_proxy_access_key_id
    provider: cloudflare
    source: generated_by_cloudflare_integration_service
    target_openbao_name: object-storage-service.r2.proxy_access_key_id

  - key: object_storage_r2_proxy_secret_access_key
    provider: cloudflare
    source: generated_by_cloudflare_integration_service
    target_openbao_name: object-storage-service.r2.proxy_secret_access_key

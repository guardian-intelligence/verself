---
# Provision company email domains: register and verify Resend sending domains,
# then enable Cloudflare Email Routing for operator mailboxes. This is
# controller-side provider setup; runtime Resend sending keys are created by
# email-service after site OpenBao is available.
#
# Run with the host Ansible toolchain, pointing roles at the integration trees:
#
#   ANSIBLE_ROLES_PATH=src/integrations/resend/domain-bootstrap:src/integrations/cloudflare/email-routing \
#     ansible-playbook -i src/sites/prod/inventory.ini \
#       -e verself_site=prod \
#       src/integrations/email/provision-email-domains.yml
#
# Cloudflare DNS mutations run from controller authority. Email Routing may use
# a separate explicit cloudflare_company_api_token when the account-admin token
# does not carry Email Routing permissions.
#
# Resend keeps its MX/SPF on the send.<domain> subdomain and DKIM on
# resend._domainkey, so the apex is free for Cloudflare Email Routing's records.
- name: Provision company email domains
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "../../host/sites/{{ verself_site | default('prod') }}/vars.yml"
  vars:
    resend_full_access_api_key: "{{ lookup('ansible.builtin.env', 'RESEND_FULL_ACCESS_API_KEY') }}"
    cloudflare_account_admin_api_token: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_ACCOUNT_ADMIN_API_TOKEN') }}"
  tasks:
    - name: Register and verify Resend sending domains
      ansible.builtin.include_tasks: provision-resend-domain.yml
      loop: "{{ resend_sending_domains }}"
      loop_control:
        loop_var: sending_domain
        label: "{{ sending_domain.domain }}"

    - name: Enable Cloudflare Email Routing for operator mailboxes
      ansible.builtin.include_role:
        name: email_routing

---
# Provision the company email domains: register and verify each Resend sending
# domain, then enable Cloudflare Email Routing for the operator mailboxes. All
# work runs on the controller against the Resend and Cloudflare APIs.
#
# Run with the host Ansible toolchain so community.general resolves, pointing
# roles at the integration trees:
#
#   ANSIBLE_ROLES_PATH=src/integrations/resend/domain-bootstrap:src/integrations/cloudflare/email-routing \
#     ansible-playbook -i src/host/sites/prod/inventory.ini \
#       -e verself_site=prod src/integrations/email/provision-email-domains.yml
#
# The Cloudflare token (CLOUDFLARE_API_TOKEN) must carry the
# "Email Routing" edit permission in addition to Zone DNS edit; the enable call
# returns 403 without it. After it runs, click the verification link Cloudflare
# emails to the forwarding destination.
#
# Resend keeps its MX/SPF on the send.<domain> subdomain and DKIM on
# resend._domainkey, so the apex is free for Cloudflare Email Routing's records.
- name: Provision company email domains
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "../../host/sites/{{ verself_site | default('prod') }}/vars.yml"
  vars:
    cloudflare_api_token: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
    cloudflare_company_api_token: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_COMPANY_API_TOKEN') | default(cloudflare_api_token, true) }}"
    resend_api_key: "{{ lookup('ansible.builtin.env', 'RESEND_API_KEY') }}"
  tasks:
    - name: Assert email bootstrap API tokens are present
      ansible.builtin.assert:
        that:
          - cloudflare_api_token | length > 0
          - cloudflare_company_api_token | length > 0
          - resend_api_key | length > 0
        fail_msg: "Set CLOUDFLARE_API_TOKEN, optional CLOUDFLARE_COMPANY_API_TOKEN, and RESEND_API_KEY before provisioning email domains."
      no_log: true

    - name: Register and verify Resend sending domains
      ansible.builtin.include_tasks: provision-resend-domain.yml
      loop: "{{ resend_sending_domains }}"
      loop_control:
        loop_var: sending_domain
        label: "{{ sending_domain.domain }}"

    - name: Enable Cloudflare Email Routing for operator mailboxes
      ansible.builtin.include_role:
        name: email_routing

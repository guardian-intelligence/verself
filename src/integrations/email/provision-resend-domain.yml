---
# Register and verify one Resend sending domain. Looped from
# provision-email-domains.yml; sending_domain is the loop item. A wrapper file is
# used because include_role's own `vars` cannot see a loop_var bound on the same
# task, but it resolves normally from this included task's scope.
- name: "Register and verify {{ sending_domain.domain }} with Resend"
  ansible.builtin.include_role:
    name: resend
  vars:
    resend_domain: "{{ sending_domain.domain }}"
    resend_zone: "{{ sending_domain.zone }}"
    resend_root_dmarc_domain: "{{ sending_domain.root_dmarc_domain }}"

version: verself.integrations.v1
site: prod
secret_store_policy: openbao_only
provider_project:
  engine: stripe_projects
  project_name: verself-prod
  directory: src/integrations/stripe-projects/sites/prod
  status: not_initialized
  bootstrap_command: aspect integrations stripe-projects --site=prod --action=init --confirm
bootstrap_exceptions:
  - key: edge.cloudflare_parent_zone_dns
    provider: cloudflare
    isolation: bootstrap_shared
    credential_keys:
      - cloudflare_api_token
    storage_targets:
      - controller_openbao
      - host_credstore
    allowed_uses:
      - aspect integrations cloudflare-dns
      - haproxy lego DNS-01 certificate renewal
      - Resend and Cloudflare Email Routing DNS bootstrap
    reason: Cloudflare DNS token resources are zone scoped for verself.sh.
  - key: company.cloudflare_email_routing
    provider: cloudflare
    isolation: bootstrap_shared
    credential_keys:
      - cloudflare_company_api_token
    storage_targets:
      - controller_openbao
      - host_credstore
    allowed_uses:
      - company-domain Email Routing bootstrap
    reason: guardianintelligence.org mail routing is a company-domain resource.
integrations:
  - key: infrastructure.latitude
    provider: latitude
    replacement: provider_specific
    owner: src/tools/provisioning
    purpose: bare_metal_provisioning
    credentials:
      - key: infrastructure.latitude.auth_token
        source: bootstrap_session
        target: provisioning_bootstrap
        target_store: controller_openbao
        openbao_name: infrastructure.latitude.auth_token
    reason: Latitude is not a Stripe Projects-backed runtime integration.
  - key: edge.cloudflare_dns
    provider: cloudflare
    replacement: partial_stripe_projects_candidate
    owner: src/integrations/cloudflare
    purpose: dns_and_tls
    credentials:
      - key: edge.cloudflare.parent_zone_dns_token
        source: bootstrap_session
        target: host_credstore
        target_store: controller_openbao
        openbao_name: edge.cloudflare.parent_zone_dns_token
        isolation: bootstrap_shared
    reason: Projects can help link Cloudflare resources, but parent-zone DNS remains a bootstrap exception.
  - key: billing.stripe
    provider: stripe
    replacement: keep_provider_native
    owner: src/services/billing-service
    purpose: billing
    credentials:
      - key: billing-service.stripe.secret_key
        source: manual_provider_dashboard
        target: runtime_secret
        target_store: site_openbao
        openbao_name: billing-service.stripe.secret_key
      - key: billing-service.stripe.webhook_secret
        source: provider_webhook_endpoint
        target: runtime_secret
        target_store: site_openbao
        openbao_name: billing-service.stripe.webhook_secret
      - key: billing-service.stripe.publishable_key
        source: provider_dashboard
        target: public_config
        site_var: stripe_publishable_key
      - key: billing-service.stripe.test_webhook_endpoint_id
        source: provider_webhook_endpoint
        target: provider_resource_id
        catalog_field: stripe_test_webhook_endpoint_id
    reason: Stripe Projects provisions third-party services; it does not replace Verself's Stripe Billing integration.
  - key: email.resend
    provider: resend
    replacement: stripe_projects_candidate
    owner: src/services/email-service
    purpose: outbound_email
    credentials:
      - key: email-service.resend.api_key
        source: stripe_projects_env
        external_name: RESEND_API_KEY
        target: runtime_secret
        target_store: site_openbao
        openbao_name: email-service.resend.api_key
    migration_check: aspect integrations stripe-projects --site=prod --action=search --query=resend
  - key: github.runner_app
    provider: github
    replacement: provider_specific
    owner: src/services/github-integration-service
    purpose: hosted_runner_integration
    credentials:
      - key: github-integration-service.github.private_key
        source: provider_dashboard
        target: runtime_secret
        target_store: site_openbao
        openbao_name: github-integration-service.github.private_key
      - key: github-integration-service.github.webhook_secret
        source: provider_webhook_config
        target: runtime_secret
        target_store: site_openbao
        openbao_name: github-integration-service.github.webhook_secret
      - key: github-integration-service.github.oauth_client_secret
        source: provider_oauth_app
        target: runtime_secret
        target_store: site_openbao
        openbao_name: github-integration-service.github.oauth_client_secret
    public_config:
      - github_integration_service_github_app_client_id
      - github_integration_service_github_app_slug
    reason: GitHub App installation, webhook, runner, and OAuth setup remain provider-specific.
  - key: identity.zitadel_github_login
    provider: zitadel
    replacement: internal_runtime
    owner: src/infrastructure-components/zitadel
    purpose: identity_provider_bootstrap
    credentials:
      - key: github-integration-service.github.oauth_client_secret
        source: provider_oauth_app
        target: host_credstore
        target_store: site_openbao
        openbao_name: github-integration-service.github.oauth_client_secret
    reason: Zitadel is hosted inside the Verself site.
  - key: runtime.generated_host_secrets
    provider: verself
    replacement: internal_runtime
    owner: src/host
    purpose: host_and_service_bootstrap
    generation: host_convergence_to_site_openbao
    credentials:
      - key: postgresql.admin.password
        source: generated
        target: host_credstore
        target_store: site_openbao
        openbao_name: postgresql.admin.password
      - key: postgresql.billing.password
        source: generated
        target: host_credstore
        target_store: site_openbao
        openbao_name: postgresql.billing.password
      - key: postgresql.sandbox_rental.password
        source: generated
        target: host_credstore
        target_store: site_openbao
        openbao_name: postgresql.sandbox_rental.password
      - key: postgresql.iam_service.password
        source: generated
        target: host_credstore
        target_store: site_openbao
        openbao_name: postgresql.iam_service.password
      - key: postgresql.email_service.password
        source: generated
        target: host_credstore
        target_store: site_openbao
        openbao_name: postgresql.email_service.password
      - key: zitadel.database.password
        source: generated
        target: host_credstore
        target_store: site_openbao
        openbao_name: zitadel.database.password
      - key: zitadel.masterkey
        source: generated
        target: host_credstore
        target_store: site_openbao
        openbao_name: zitadel.masterkey
      - key: zitadel.admin.password
        source: generated
        target: host_credstore
        target_store: site_openbao
        openbao_name: zitadel.admin.password
      - key: zitadel.admin.pat
        source: generated
        target: host_credstore
        target_store: site_openbao
        openbao_name: zitadel.admin.pat
      - key: stalwart.admin.password
        source: generated
        target: host_credstore
        target_store: site_openbao
        openbao_name: stalwart.admin.password
      - key: platform.agent.password
        source: generated
        target: host_credstore
        target_store: site_openbao
        openbao_name: platform.agent.password
      - key: iam-service.email_identity.hmac_key
        source: generated
        target: runtime_secret
        target_store: site_openbao
        openbao_name: iam-service.email_identity.hmac_key
      - key: distribution-service.tuf.ed25519_seed
        source: generated
        target: runtime_secret
        target_store: site_openbao
        openbao_name: distribution-service.tuf.ed25519_seed
    reason: These values are generated or hosted by Verself components.

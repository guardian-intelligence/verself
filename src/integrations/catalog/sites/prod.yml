version: verself.integrations.v1
site: prod
secret_store_policy: openbao_only
provider_project:
  engine: stripe_projects
  project_name: verself-prod
  directory: src/integrations/stripe-projects/sites/prod
  status: not_initialized
  bootstrap_command: aspect integrations stripe-projects --site=prod --action=init --confirm
bootstrap_exceptions:
  - key: cloudflare.account_admin
    provider: cloudflare
    isolation: controller_only
    credential_keys:
      - cloudflare_account_admin_api_token_a
      - cloudflare_account_admin_api_token_b
    storage_targets:
      - controller_openbao
    allowed_uses:
      - reconcile hosted-zone DNS records
      - issue and project site TLS certificates
      - create site-scoped R2 deployment artifact child tokens
      - create site-scoped R2 object-storage child tokens
      - create recovery R2 child tokens
    reason: Cloudflare account API tokens are account authority and must never be generated bootstrap vars or runtime material.
integrations:
  - key: infrastructure.latitude
    provider: latitude
    replacement: provider_specific
    owner: src/tools/provisioning
    purpose: bare_metal_provisioning
    credentials:
      - key: infrastructure.latitude.auth_token
        source: provider_dashboard
        target: provisioning_bootstrap
        target_store: controller_openbao
        openbao_name: infrastructure.latitude.auth_token
    reason: Latitude is not a Stripe Projects-backed runtime integration.
  - key: edge.cloudflare_dns
    provider: cloudflare
    replacement: partial_stripe_projects_candidate
    owner: src/integrations/cloudflare
    purpose: dns_and_tls
    controller: prod
    reason: Prod owns Cloudflare DNS reconciliation and TLS certificate issuance for every Verself site.
  - key: billing.stripe
    provider: stripe
    replacement: keep_provider_native
    owner: src/services/billing-service
    purpose: billing
    credentials:
      - key: billing-service.stripe.secret_key
        source: manual_provider_dashboard
        target: runtime_secret
        target_store: site_openbao
        openbao_name: billing-service.stripe.secret_key
      - key: billing-service.stripe.webhook_secret
        source: provider_webhook_endpoint
        target: runtime_secret
        target_store: site_openbao
        openbao_name: billing-service.stripe.webhook_secret
      - key: billing-service.stripe.publishable_key
        source: provider_dashboard
        target: public_config
        site_var: stripe_publishable_key
      - key: billing-service.stripe.test_webhook_endpoint_id
        source: provider_webhook_endpoint
        target: provider_resource_id
        catalog_field: stripe_test_webhook_endpoint_id
    reason: Stripe Projects provisions third-party services; it does not replace Verself's Stripe Billing integration.
  - key: github.runner_app
    provider: github
    replacement: provider_specific
    owner: src/services/github-integration-service
    purpose: hosted_runner_integration
    credentials:
      - key: github-integration-service.github.private_key
        source: provider_dashboard
        target: runtime_secret
        target_store: site_openbao
        openbao_name: github-integration-service.github.private_key
      - key: github-integration-service.github.webhook_secret
        source: provider_webhook_config
        target: runtime_secret
        target_store: site_openbao
        openbao_name: github-integration-service.github.webhook_secret
      - key: github-integration-service.github.oauth_client_secret
        source: provider_oauth_app
        target: runtime_secret
        target_store: site_openbao
        openbao_name: github-integration-service.github.oauth_client_secret
    public_config:
      - github_integration_service_github_app_client_id
      - github_integration_service_github_app_slug
    reason: GitHub App installation, webhook, runner, and OAuth setup remain provider-specific.
  - key: identity.zitadel_github_login
    provider: zitadel
    replacement: internal_runtime
    owner: src/infrastructure-components/zitadel
    purpose: identity_provider_bootstrap
    credentials:
      - key: github-integration-service.github.oauth_client_secret
        source: provider_oauth_app
        target: runtime_secret
        target_store: site_openbao
        openbao_name: github-integration-service.github.oauth_client_secret
    reason: Zitadel is hosted inside the Verself site.

---
deployment_promotion_gates:
  - name: web_browser_smoke
    kind: browser
    size: medium
    evidence_query: |
      SELECT count()
      FROM verself_deploy.canary_executions_v1
      WHERE site = {site:String}
        AND deploy_run_key = {deploy_run_key:String}
        AND component = 'verself_web'
        AND status = 'succeeded'
    timeout: 90s
  - name: web_guardian_oidc
    kind: browser
    size: large
    evidence_query: |
      SELECT count()
      FROM verself_deploy.canary_executions_v1
      WHERE site = {site:String}
        AND deploy_run_key = {deploy_run_key:String}
        AND component = 'verself_web'
        AND status = 'succeeded'
    timeout: 120s
